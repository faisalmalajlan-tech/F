    ART_HEAD.lastIndex = 0;
    while ((m = ART_HEAD.exec(norm))) if (m.index > 0) at[m.index] = 1;
    return at;
  }

  function splitSentences(norm) {
    var out = [], start = 0, i, heads = articleBreaks(norm);
    for (i = 0; i < norm.length; i++) {
      if (heads[i] && i > start) {
        var h = norm.slice(start, i).trim();
        if (h.length > 12) out.push({ start: start, end: i, text: h });
        start = i;
      }
      if (isBreak(norm, i)) {
        var t = norm.slice(start, i + 1).trim();
        if (t.length > 12) out.push({ start: start, end: i + 1, text: t });
        start = i + 1;
      }
    }
    var last = norm.slice(start).trim();
    if (last.length > 12) out.push({ start: start, end: norm.length, text: last });
    // تجزئة الجمل الطويلة جدًا حتى لا يصير الاقتباس صفحة كاملة
    var final = [];
    out.forEach(function (s) {
      if (s.text.length <= 420) { final.push(s); return; }
      var cut = 0;
      while (cut < s.text.length) {
        var piece = s.text.slice(cut, cut + 380);
        var sp = piece.lastIndexOf(' ');
        if (sp > 200 && cut + 380 < s.text.length) piece = piece.slice(0, sp);
        final.push({ start: s.start + cut, end: s.start + cut + piece.length, text: piece.trim() });
        cut += piece.length;
      }
    });
    return final;
  }

  /* ═══════════ ٦. الالتزامات والجزاءات ═══════════ */

  var MONEY = /(\d[\d,\.]*)\s*(ريال|ر\.س|sar|درهم|دولار)/;
  /* «عن كل يوم تأخير» تعني غرامة تتراكم — مبلغها الفعلي = القيمة × أيام التأخر */
  var PER_DAY = null, CAP_CUES = null, VALUE_CUES = null;
  var PCT = /(\d[\d\.]*)\s*(?:٪|%|في المائه|في المئه)/;

  /* يترجم إعدادات المستخدم (نص عربي خام) إلى صيغ مطبَّعة، مرة واحدة لكل إعداد.
     الذاكرة المؤقتة مفتاحها بصمة الإعداد، فتعديل الإدارة يُعاد ترجمته فورًا. */
  var _cc = { key: null, val: null };
  function compile(cfg) {
    var key = JSON.stringify(cfg);
    if (_cc.key === key) return _cc.val;
    STRUCTURAL = null; STEM_MAP = null;      // القوائم المشتقة تتبع الإعداد
    var c = {
      raw: cfg,
      deontic: normList(cfg.deontic || []),
      deonticNeg: normList(cfg.deonticNegations || []),
      prohibitive: normList((cfg.conflict && cfg.conflict.prohibitions) || []),
      parties: normList(cfg.parties || []),
      penaltyTiers: (cfg.penaltyTiers || []).map(function (t) {
        // monetary لازم هنا: إسقاطه يجعل كل جزاء غير ماليّ فلا يُقرأ مبلغه
        return { label: t.label, impact: +t.impact, monetary: !!t.monetary,
                 terms: normList(t.terms || []) };
      }),
      noPenaltyImpact: +cfg.noPenaltyImpact,
      noPenaltyLabel: cfg.noPenaltyLabel,
      clauses: (cfg.clauses || []).map(function (c2) {
        return { id: c2.id, title: c2.title, group: c2.group || 'عام',
                 impact: +c2.impact, terms: normList(c2.terms || []) };
      }),
      vague: (cfg.vague || []).map(function (v) { return { term: normStr(v.term), raw: v.term, why: v.why }; }),
      sc: cfg.scoring
    };
    _cc = { key: key, val: c };
    return c;
  }

  /* سقف الغرامة: «بما لا يتجاوز 500000 ريال» أو «بحد أقصى 10٪ من قيمة العقد».
     بدون قراءته يخرج تعرّضٌ ماليٌّ مبالغ فيه أضعافًا حين تكون الغرامة يومية. */
  function findCap(normSentence) {
    if (!CAP_CUES) CAP_CUES = normList(['بما لا يتجاوز', 'بحد أقصى', 'بحد اقصى', 'على ألا تتجاوز',
      'على الا تتجاوز', 'وبحد أعلى', 'بحد أعلى', 'وبما لا يزيد', 'بما لا يزيد عن', 'ولا تتجاوز']);
    for (var i = 0; i < CAP_CUES.length; i++) {
      var k = normSentence.indexOf(CAP_CUES[i]);
      if (k === -1) continue;
      var tail = normSentence.slice(k, k + 90);
      var m = tail.match(MONEY);
      if (m) return { amount: parseFloat(m[1].replace(/,/g, '')), kind: 'مبلغ' };
      var p = tail.match(PCT);
      if (p) return { percent: parseFloat(p[1]), kind: 'نسبة' };
    }
    return null;
  }

  function classifyPenalty(normSentence, C) {
    if (!PER_DAY) PER_DAY = normList(['عن كل يوم', 'لكل يوم', 'يومياً', 'يوميا', 'عن كل يوم تأخير', 'غرامة يومية']);
    var money = normSentence.match(MONEY);
    var amount = money ? parseFloat(money[1].replace(/,/g, '')) : null;
    if (amount !== null && !isFinite(amount)) amount = null;
    var perDay = !!(amount !== null && hasAny(normSentence, PER_DAY));
    for (var i = 0; i < C.penaltyTiers.length; i++) {
      var hit = hasAny(normSentence, C.penaltyTiers[i].terms);
      if (hit) {
        var t = C.penaltyTiers[i];
        var cap = findCap(normSentence);
        /* ذكرُ مبلغٍ لا يرفع الجسامة بذاته — كان يرفعها إلى ٠٫٨٥ فيقفز
           «إنذار برسم ٥٠ ريالًا» إلى مرتبة الغرامة الكبرى. الجسامة
           تُقرأ من المبلغ نفسه لاحقًا عبر عتبات الجوهرية. */
        return { impact: t.impact, monetary: !!t.monetary,
                 label: money ? t.label + ' (' + money[0].trim() + (perDay ? ' يوميًا' : '') +
                        (cap ? ' · سقف ' + (cap.kind === 'مبلغ' ? cap.amount.toLocaleString('en-US') : cap.percent + '٪') : '') + ')'
                        : t.label,
                 amount: amount, currency: money ? money[2] : null, perDay: perDay, cap: cap };
      }
    }
    return { impact: C.noPenaltyImpact, label: C.noPenaltyLabel, amount: null,
             currency: null, perDay: false, cap: null, monetary: false };
  }

  /* ═══════════ أكواد التتبّع ═══════════ */
  /* كود ثابت مشتق من بصمة المستند ومفتاح البند — البند نفسه يحمل
     نفس الكود في كل تحليل لاحق، فيمكن تتبّعه عبر الزمن. */
  function shortHash(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36).toUpperCase();
  }
  function makeCode(prefix, fp, key) {
    return prefix + '-' + (shortHash(fp) + 'XXX').slice(0, 3) + '-' + (shortHash(key) + 'XXXX').slice(0, 4);
  }

  /* ═══════════ ٨. حساب الخطر ═══════════ */

  function SC(sc) { return sc || NC.DEFAULTS.scoring; }

  /* المنحنى متصل لا درجي: القيم المضبوطة في الإعدادات هي نقاط ارتساء،
     وما بينها يُستكمل خطيًا. بدون هذا يبقى الخطر ساكنًا أسابيع ثم يقفز
     دفعة واحدة عند حدٍّ ما — والواقع أن اقتراب الموعد يزيد الخطر كل يوم. */
  function curve(d, anchors) {
    var i;
    for (i = 0; i < anchors.length - 1; i++) {
      var hi = anchors[i], lo = anchors[i + 1];       // hi.day > lo.day
      if (d >= lo.day && d <= hi.day) {
        var span = hi.day - lo.day;
        if (span <= 0) return lo.v;
        var t = (d - lo.day) / span;                  // 0 عند lo، 1 عند hi
        return lo.v + (hi.v - lo.v) * t;
      }
    }
    return d > anchors[0].day ? anchors[0].v : anchors[anchors.length - 1].v;
  }

  function timeDecay(d, sc) {
    var k = SC(sc).decay;
    if (d === null || d === undefined) return 1.0;
    // كلما طال التجاوز زاد الخطر، بسقف عند ضعف قيمة التجاوز
    if (d < 0) return Math.min(k.overdue * 2, k.overdue * (1 + Math.min(-d, 180) / 360));
    return curve(d, [{ day: 90, v: k.d90 }, { day: 30, v: k.d30 },
                     { day: 14, v: k.d14 }, { day: 7, v: k.d7 }, { day: 0, v: k.overdue }]);
  }
  function probFromDays(d, sc) {
    var k = SC(sc).probability;
    if (d === null || d === undefined) return k.none;   // غياب الموعد نفسه سببٌ للتأخر
    if (d < 0) return k.overdue;
    return curve(d, [{ day: 90, v: k.d90 }, { day: 30, v: k.d30 },
                     { day: 7, v: k.d7 }, { day: 0, v: k.overdue }]);
  }
  function urgencyLabel(d) {
    if (d === null || d === undefined) return 'غير مؤرّخ';
    if (d < 0)  return 'متجاوز';
    if (d < 14) return 'حرج';
    if (d < 45) return 'قريب';
    return 'مراقبة';
  }
  var clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };
  /* ── مستوى NIST من قيمةٍ بين صفر وواحد ──
     المدى في جدول D-3: 0-4 منخفض جدًا · 5-20 منخفض · 21-79 متوسط ·
     80-95 مرتفع · 96-100 مرتفع جدًا. */
  /* ── جسامة المبلغ من عتبات الجوهرية ──
     ٥٠٠ ريال و٥٠٠ ألف ليستا سواء، وكانتا تُعطيان الأثر نفسه (٠٫٨٥)
     لأن الجزاء يُقرأ بلفظه لا بمقداره. العتبات تُضبط لكل جهة — ولا
     معيار عالمي لها، فNIST نفسه يترك تعريف «الجسيم» للجهة. */
  function moneyImpact(value, sc) {
    var M = SC(sc).materiality;
    if (!M || !M.bands || value === null || value === undefined) return null;
    for (var i = 0; i < M.bands.length; i++) {
      var b = M.bands[i];
      if (b.upTo === null || b.upTo === undefined || value <= b.upTo) return b.impact;
    }
    return M.bands[M.bands.length - 1].impact;
  }

  function nistBand(v01, sc) {
    var N = SC(sc).nist, pct = clamp(v01, 0, 1) * 100, i, id, L;
    for (i = N.order.length - 1; i >= 0; i--) {
      id = N.order[i]; L = N.levels[id];
      if (pct >= L.min) return id;
    }
    return N.order[0];
  }

  /* ── درجة البند بمصفوفة NIST (جدول I-2) ──
     الأثر هو الغالب: احتمالٌ مرتفع جدًا بأثرٍ منخفض جدًا يبقى «منخفضًا
     جدًا»، وأثرٌ مرتفع جدًا باحتمالٍ متوسط يصعد إلى «مرتفع». هذا ما لا
     يفعله الضرب — فهو يُذيب الأثر الكارثي كلما بعُد الموعد.
     وعامل الزمن يُطوى داخل الاحتمالية لا يُضرب بعدها، لأن NIST يعرّف
     الاحتمالية بأنها «احتمال وقوع الحدث وإفضائه إلى أثر» — فالزمن
     جزءٌ منها لا بُعدٌ ثالث. */
  function nistRisk(p, i, d, sc) {
    var N = SC(sc).nist;
    var L = nistBand(clamp(p * timeDecay(d, sc), 0, 1), sc);
    var I = nistBand(i, sc);
    var lvl = N.matrix[L][N.order.indexOf(I)];
    return { level: lvl, score: N.levels[lvl].mid, likelihood: L, impact: I };
  }

  function itemRisk(p, i, d, sc) {
    if (SC(sc).model === 'nist') return nistRisk(p, i, d, sc).score;
    return Math.round(clamp(clamp(p, 0, 1) * clamp(i, 0, 1) * timeDecay(d, sc) * 100, 0, 100));
  }
  /* الدرجة الكلية: ٦٠٪ من أعلى بند + ٤٠٪ من الجذر التربيعي للمتوسط.
     الحد الأعلى يمنع بندًا حرجًا واحدًا من أن تبتلعه بنود هادئة —
     وهو ما لا يفعله الجذر التربيعي وحده. */
  function aggregateRisk(items, sc) {
    if (!items.length) return 0;
    var w = SC(sc).aggregate;
    var max = Math.max.apply(null, items);
    var rms = Math.sqrt(items.reduce(function (a, x) { return a + x * x; }, 0) / items.length);
    return Math.round(max * w.maxWeight + rms * w.rmsWeight);
  }
  function sevFromRisk(r, sc) {
    var t = SC(sc).thresholds;
    return r >= t.critical ? 'critical' : r >= t.medium ? 'medium' : 'low';
  }

  /* ═══════════ ٩. التحليل ═══════════ */

  var STOP = normList(['من','إلى','على','في','عن','مع','هذا','هذه','ذلك','التي','الذي','أن','إن',
    'ما','لا','قد','كل','بين','عند','بعد','قبل','أو','و','ثم','كما','حيث','وفق','وفقاً','بموجب','يتم','تم']);

  /* ألفاظ الإلزام وأسماء الأطراف تتكرر في كل بند، فوجودها لا يدل على تغطية
     الموضوع. نستبعدها حتى تُقارَن الكلمات الموضوعية وحدها. */
  var STRUCTURAL = null, CC = null;
  function structuralWords() {
    if (STRUCTURAL) return STRUCTURAL;
    // contentWords قد تُستدعى من خارج analyze (كاشف التعارض مثلًا)،
    // فنسقط على الإعدادات الافتراضية بدل الانهيار.
    if (!CC) CC = compile(NC.DEFAULTS);
    STRUCTURAL = {};
    STOP.concat(CC.deontic, CC.parties).forEach(function (t) {
      t.split(' ').forEach(function (w) { if (w.length > 1) STRUCTURAL[w] = 1; });
    });
    return STRUCTURAL;
  }
  /* تجذير خفيف: العربية تصرّف الكلمة الواحدة بصيغ كثيرة («مستقل/مستقلة/المستقلة»)
     فبدونه تُعدّ صيغتان لنفس الكلمة غير متطابقتين وتنهار المطابقة. */
  var STEM_MAP = null;
  function stem(w) {
    if (!STEM_MAP) {
      STEM_MAP = {};
      var raw = (CC && CC.raw && CC.raw.stemMap) || NC.DEFAULTS.stemMap || {};
      Object.keys(raw).forEach(function (k) { STEM_MAP[normStr(k)] = normStr(raw[k]); });
    }
    var bare = w.replace(/^(وال|بال|كال|فال|ال|و|ب|ل|ف|ك)/, '');
    if (STEM_MAP[w]) w = STEM_MAP[w];
    else if (STEM_MAP[bare]) w = STEM_MAP[bare];
    w = w.replace(/^(وال|بال|كال|فال|ال|و|ب|ل|ف|ك)/, '');
    w = w.replace(/(اتها|اتهم|يتها|ياتهم|هما|كما|هم|هن|نا|كم|ها|ه|ي)$/, '');
    w = w.replace(/(اتين|ييه|يات|ات|ين|ون|يه|ية|ه|ا)$/, '');
    return w.length >= 3 ? w : null;
  }
  function contentWords(normText) {
    var sw = structuralWords(), out = [], seen = {};
    normText.split(/[^ء-ي0-9a-z]+/).forEach(function (w) {
      if (w.length <= 2 || sw[w]) return;
      var st = stem(w);
      if (!st || sw[st] || seen[st]) return;
      seen[st] = 1; out.push(st);
    });
    return out;
  }

  function analyze(opts) {
    var C = compile(NC.merge(NC.DEFAULTS, opts.config || null));
    var sc = C.sc, COVER_THRESHOLD = sc.coverageThreshold;
    CC = C; STRUCTURAL = null;               // إعادة بناء قائمة الكلمات الهيكلية لهذا الإعداد
    var text = opts.docText || '';
    var refText = opts.refText || '';
    var today = todayUTC(opts.todayISO);
    var focus = normList((opts.context || '').split(/[،,\n]/).filter(Boolean));

    var nm = normMap(text);
    var norm = nm.norm, map = nm.map;
    var toOrig = function (a, b) {
      if (!map.length) return { start: 0, end: 0 };
      return { start: map[clamp(a, 0, map.length - 1)],
               end: map[clamp(b - 1, 0, map.length - 1)] + 1 };
    };
    var quoteAt = function (a, b) { var r = toOrig(a, b); return text.slice(r.start, r.end).trim(); };

    /* قيمة العقد — لتحويل السقف النسبي إلى مبلغ. إن لم تُذكر، يبقى
       التعرّض «غير محسوب» بدل أن نعرض رقمًا نعرف أنه فوق السقف. */
    if (!VALUE_CUES) VALUE_CUES = normList(['قيمة العقد', 'إجمالي قيمة العقد', 'قيمة هذا العقد',
      'القيمة الإجمالية', 'قيمة الاتفاقية', 'مبلغ العقد']);
    var contractValue = null;
    for (var vi = 0; vi < VALUE_CUES.length; vi++) {
      var vk = norm.indexOf(VALUE_CUES[vi]);
      if (vk === -1) continue;
      var vm = norm.slice(vk, vk + 90).match(MONEY);
      if (vm) { contractValue = parseFloat(vm[1].replace(/,/g, '')); break; }
    }

    var sentences = splitSentences(norm);
    var dates = findDates(norm);
    var durations = findDurations(norm);

    /* تاريخ المرجع (تاريخ التحرير) — أول تاريخ في مقدمة المستند، تُسنَد إليه المدد النسبية */
    var anchor = null;
    var headEnd = Math.max(1200, Math.floor(norm.length * 0.12));
    for (var ai = 0; ai < dates.length; ai++) {
      if (dates[ai].at < headEnd) { anchor = dates[ai]; break; }
    }

    /* إشارات الاستحقاق: التاريخ الذي تسبقه إحداها هو الموعد المقصود،
       لا أول تاريخ في الجملة. «يبدأ 2026-09-01 وينتهي 2026-12-31» موعده
       الثاني لا الأول — فإن لم توجد إشارة نأخذ آخر تاريخ. */
    var DUE_CUES = normList(['قبل تاريخ', 'بحلول', 'في موعد أقصاه', 'موعد أقصاه', 'حتى تاريخ',
      'في موعد لا يتجاوز', 'لا يتجاوز تاريخ', 'قبل حلول', 'في تاريخ أقصاه', 'وينتهي', 'الانتهاء']);
    /* الإشارة يجب أن تلاصق التاريخ. بنافذة واسعة تلتقطُ إشارةَ تاريخٍ
       سابق: «قبل تاريخ 2026-11-30 وليس 2026-02-01» كانت تُعدّ الإشارة
       سابقةً للتاريخ الثاني أيضًا. */
    var BASE_CUES = normList(['من تاريخ', 'اعتباراً من', 'اعتبارا من', 'ابتداءً من', 'بدءاً من', 'من']);
    function nearCue(at, cues, span, tail) {
      var win = norm.slice(Math.max(0, at - span), at);
      var hit = hasAny(win, cues);
      if (!hit) return false;
      return win.lastIndexOf(hit) + hit.length >= win.length - tail;
    }
    var cueBefore = function (at) { return nearCue(at, DUE_CUES, 18, 9); };

    function pickDeadline(a, b) {
      var inRange = dates.filter(function (x) { return x.at >= a && x.at < b; });
      var dur = durations.filter(function (x) { return x.at >= a && x.at < b; })[0];

      /* «خلال ثلاثين يوماً من تاريخ 2026/01/10» موعده التاريخ + المدة،
         لا التاريخ نفسه — فالتاريخ هنا أساسٌ لا استحقاق. */
      if (dur && inRange.length) {
        var base = inRange.filter(function (x) {
          return x.at > dur.at && nearCue(x.at, BASE_CUES, 16, 8);
        })[0];
        if (base) {
          return { ts: base.ts + dur.days * DAY, approx: base.approx,
                   raw: dur.raw + ' (من ' + base.raw + ')' };
        }
      }
      if (inRange.length) {
        var cued = inRange.filter(function (x) { return cueBefore(x.at); });
        var pick = cued.length ? cued[cued.length - 1] : inRange[inRange.length - 1];
        return { ts: pick.ts, raw: pick.raw, approx: pick.approx };
      }
      if (!dur) return null;
      return { ts: anchor ? anchor.ts + dur.days * DAY : null,
               raw: dur.raw + (anchor ? ' (من ' + anchor.raw + ')' : ' (بلا تاريخ مرجعي)'),
               approx: anchor ? anchor.approx : false };
    }
    var nextIdx = {};
    sentences.forEach(function (s2, i2) { if (i2 + 1 < sentences.length) nextIdx[s2.start] = i2 + 1; });

    /* جزاءٌ عام يسري على المستند كله: «يترتب على مخالفة أحكام هذه اللائحة...».
       بدونه يخرج كل بندٍ لم يذكر جزاءه بأثر 0.35 مع أن الفسخ يشمله. */
    var GENERAL_SCOPE = normList(['مخالفة أحكام هذه', 'مخالفة هذه', 'أي مخالفة', 'مخالفة أحكام',
      'مخالفة هذا العقد', 'مخالفة هذه السياسة', 'مخالفة هذه اللائحة', 'الإخلال بأحكام', 'الإخلال بهذه']);
    var docPenalty = null;
    sentences.forEach(function (s2) {
      if (!hasAny(s2.text, GENERAL_SCOPE)) return;
      var p = classifyPenalty(s2.text, C);
      if (p.impact <= C.noPenaltyImpact) return;
      if (!docPenalty || p.impact > docPenalty.impact) {
        docPenalty = { impact: p.impact, label: p.label, quote: quoteAt(s2.start, s2.end) };
      }
    });

    /* ── الالتزامات ── */
    var obligations = [];
    sentences.forEach(function (s) {
      var marker = hasAny(s.text, C.deontic);
      if (!marker) return;
      /* «لا يلتزم المورد بتقديم تقارير» إعفاء لا التزام. أما «لا يجوز»
         و«يحظر» فهي التزام بالامتناع، ولذلك تُستثنى من إلغاء النفي. */
      if (hasAny(s.text, C.deonticNeg) && !hasAny(s.text, C.prohibitive)) return;

      var picked = pickDeadline(s.start, s.end);
      // ٥) الموعد قد يرد في الجملة التالية: «يلتزم المورد بالتسليم. ويكون
      //    ذلك خلال ثلاثين يوماً». نأخذها فقط إن لم تكن التزامًا مستقلًا.
      var fromNext = false;
      if (!picked && nextIdx[s.start] !== undefined) {
        var nx = sentences[nextIdx[s.start]];
        if (nx && !hasAny(nx.text, C.deontic)) {
          picked = pickDeadline(nx.start, nx.end);
          fromNext = !!picked;
        }
      }
      var d = picked ? picked.ts : null;
      var source = picked ? picked.raw + (fromNext ? ' (من الجملة التالية)' : '') : null;
      var approx = picked ? picked.approx : false;

      var days = d === null ? null : Math.round((d - today) / DAY);
      var pen = classifyPenalty(s.text, C);
      /* الجزاء العام أضعف دلالةً من المنصوص في البند نفسه، فيُخصم منه قليلًا */
      var generalPenalty = false;
      if (pen.impact <= C.noPenaltyImpact && docPenalty) {
        pen = { impact: Math.max(C.noPenaltyImpact, docPenalty.impact * 0.85),
                label: 'جزاء عام: ' + docPenalty.label, amount: null, currency: null,
                perDay: false, cap: null, monetary: false };
        generalPenalty = true;
      }
      var party = hasAny(s.text, C.parties);
      var q = quoteAt(s.start, s.end);
      obligations.push({
        quote: q, marker: marker, party: party,
        rawDeadline: source, deadlineTS: d, approxDate: approx,
        daysRemaining: days, urgency: urgencyLabel(days),
        penalty: pen.label, impact: pen.impact,
        penaltyAmount: pen.amount, penaltyCurrency: pen.currency, penaltyPerDay: pen.perDay,
        penaltyCap: pen.cap, generalPenalty: generalPenalty, penaltyMonetary: pen.monetary,
        probability: probFromDays(days, sc),
        risk: itemRisk(probFromDays(days, sc), pen.impact, days, sc),
        focused: focus.length ? focus.some(function (f) { return s.text.indexOf(f) > -1; }) : false,
        _s: s.start, _e: s.end
      });
    });
    obligations.forEach(function (o, i) {
      o.severity = sevFromRisk(o.risk, sc);
      /* التعرض المالي: المتجاوز غرامته جارية (× أيام التأخر إن كانت يومية)،
         والقادم غرامته محتملة عند التخلف. */
      o.exposure = null; o.exposureNote = null;
      if (o.penaltyAmount !== null && o.penaltyAmount !== undefined && o.daysRemaining !== null) {
        var raw = o.penaltyPerDay && o.daysRemaining < 0
          ? o.penaltyAmount * Math.min(-o.daysRemaining, 3650)
          : o.penaltyAmount;
        var cap = o.penaltyCap;
        if (cap && cap.kind === 'مبلغ') {
          o.exposure = Math.min(raw, cap.amount);
          if (raw > cap.amount) o.exposureNote = 'بلغ السقف المنصوص (' + cap.amount.toLocaleString('en-US') + ')';
        } else if (cap && cap.kind === 'نسبة') {
          if (contractValue) {
            var capAmt = contractValue * cap.percent / 100;
            o.exposure = Math.min(raw, capAmt);
            o.exposureNote = 'سقف ' + cap.percent + '٪ من قيمة العقد = ' + Math.round(capAmt).toLocaleString('en-US');
          } else {
            // سقف نسبي وقيمة العقد غير مذكورة: أي رقم نعرضه قد يتجاوز السقف
            o.exposure = null;
            o.exposureNote = 'محدود بـ' + cap.percent + '٪ من قيمة العقد — القيمة غير مذكورة في المستند';
          }
        } else {
          o.exposure = raw;
        }
        o.exposureAccruing = o.daysRemaining < 0;
      }

      /* الجسامة تُقرأ من المقدار متى وُجد. نقيسها على التعرّض الكامل لا
         على الرقم المفرد: غرامةٌ يومية ٥٠٠ ريال مستمرةٌ منذ سنة تعرّضٌ
         قدره ١٨٢٥٠٠ — وقياسها بالـ٥٠٠ يُهوّنها. والجزاء غير المالي
         (فسخ، سحب ترخيص) لا يخفضه مبلغٌ صغير يرافقه، فنأخذ الأعلى. */
      var basis = o.exposure !== null && o.exposure !== undefined ? o.exposure : o.penaltyAmount;
      var mi = moneyImpact(basis, sc);
      if (mi !== null) {
        o.impact = o.penaltyMonetary ? mi : Math.max(o.impact, mi);
        o.impactBasis = basis;
        o.risk = itemRisk(o.probability, o.impact, o.daysRemaining, sc);
        o.severity = sevFromRisk(o.risk, sc);
      }
      o.key = normStr(o.quote).slice(0, 70);
      o.index = i;
    });

    /* ── الفجوات ── */
    var gaps = [];
    function pushGap(g) {
      var d = g.daysRemaining === undefined ? null : g.daysRemaining;
      g.risk = itemRisk(g.probability, g.impact, d, sc);
      g.severity = sevFromRisk(g.risk, sc);
      g.decay = timeDecay(d, sc);
      // الاقتباس جزء من المفتاح: فجوتان بنفس العنوان (كـ«التزام غير محدد المدة»)
      // تنتميان لبندين مختلفين ويجب أن تحملا كودين مختلفين.
      g.key = g.type + '|' + normStr(g.title).slice(0, 50) + '|' + normStr(g.evidence || '').slice(0, 60);
      gaps.push(g);
    }

    // (أ) مواعيد متجاوزة
    obligations.filter(function (o) { return o.daysRemaining !== null && o.daysRemaining < 0; })
      .forEach(function (o) {
        pushGap({ type: 'موعد متجاوز', title: 'موعد انقضى منذ ' + Math.abs(o.daysRemaining) + ' يومًا',
          description: 'التزام مؤرّخ مضى موعده ولم يرد في المستند ما يفيد تنفيذه أو تمديده.' +
            (o.penalty !== 'لا جزاء منصوص عليه' ? ' الجزاء المنصوص: ' + o.penalty + '.' : ''),
          recommendation: 'وثّق التنفيذ أو اطلب تمديدًا كتابيًا قبل تفعيل الجزاء.',
          evidence: o.quote, evidenceType: 'quote',
          probability: o.probability, impact: o.impact, daysRemaining: o.daysRemaining });
      });

    // (ب) التزام بلا موعد
    obligations.filter(function (o) { return o.daysRemaining === null; })
      .forEach(function (o) {
        pushGap({ type: 'التزام بلا موعد', title: 'التزام غير محدد المدة',
          description: 'الجملة تحمل صيغة إلزام («' + o.marker + '») دون تاريخ أو مدة يمكن قياس التأخر عنها.',
          recommendation: 'أضف موعدًا صريحًا أو مدة محسوبة من تاريخ محدد.',
          evidence: o.quote, evidenceType: 'quote',
          probability: sc.gapProbability.noDeadline, impact: o.impact, daysRemaining: null });
      });

    // (ج) صياغة فضفاضة
    C.vague.forEach(function (v) {
      var idx = norm.indexOf(v.term);
      if (idx === -1) return;
      var host = sentences.filter(function (s) { return idx >= s.start && idx < s.end; })[0];
      pushGap({ type: 'صياغة فضفاضة', title: 'عبارة غير قابلة للقياس: «' + v.raw + '»',
        description: v.why + '.', recommendation: 'استبدلها بمدة أو تاريخ أو معيار قابل للتحقق.',
        evidence: host ? quoteAt(host.start, host.end) : quoteAt(idx, idx + v.term.length + 60),
        evidenceType: 'quote', probability: sc.gapProbability.vague, impact: sc.gapImpact.vague, daysRemaining: null });
    });

    // (د) بنود معيارية غائبة
    /* نوع المستند يحدد أي مجموعات بنود تُفحص. «فحص كل البنود» أو نوع
       غير معروف يعني فحص الكل كما كان. */
    var groups = C.raw.docTypes ? C.raw.docTypes[opts.docType] : null;
    var activeClauses = groups
      ? C.clauses.filter(function (c) { return groups.indexOf(c.group || 'عام') > -1; })
      : C.clauses;
    var clauseReport = activeClauses.map(function (c) {
      var hit = hasAny(norm, c.terms);
      return { id: c.id, title: c.title, present: !!hit, hit: hit, impact: c.impact };
    });
    clauseReport.filter(function (c) { return !c.present; }).forEach(function (c) {
      pushGap({ type: 'بند مفقود', title: 'لا يوجد بند: ' + c.title,
        description: 'بحثنا عن كل الصيغ الشائعة لهذا البند في المستند ولم نجد أيًّا منها.',
        recommendation: 'أضف بندًا يعالج «' + c.title + '» أو وثّق سبب استبعاده.',
        evidence: null, evidenceType: 'absence',
        probability: sc.gapProbability.missingClause, impact: c.impact, daysRemaining: null });
    });

    gaps.sort(function (a, b) { return b.risk - a.risk; });

    /* ── التنبؤات: كل التزام مؤرّخ لم يحن موعده بعد ── */
    var preds = obligations
      .filter(function (o) { return o.daysRemaining !== null && o.daysRemaining >= 0; })
      .sort(function (a, b) { return a.daysRemaining - b.daysRemaining; })
      .map(function (o) {
        return { title: 'يستحق خلال ' + o.daysRemaining + ' يومًا',
          trigger: o.rawDeadline || '—', approxDate: o.approxDate,
          deadlineISO: new Date(o.deadlineTS).toISOString().slice(0, 10),
          consequence: o.penalty === 'لا جزاء منصوص عليه'
            ? 'لم ينص المستند على جزاء صريح لهذا التأخر — الأثر تعاقدي عام.'
            : 'عند التأخر يترتب: ' + o.penalty + '.',
          recommendation: o.daysRemaining < 14
            ? 'ابدأ التنفيذ الآن — النافذة أقل من أسبوعين.'
            : 'أدرجه في خطة الربع وحدّد مسؤولًا.',
          evidence: o.quote, daysRemaining: o.daysRemaining, obKey: o.key, obIndex: o.index,
          risk: o.risk, severity: o.severity };
      });

    /* ── التغطية مقابل المرجع ── */
    var coverage = null;
    if (refText && refText.trim()) {
      var rn = normMap(refText), rSent = splitSentences(rn.norm);
      var docWords = sentences.map(function (s) { return contentWords(s.text); });

      /* الندرة تُقاس على المرجع نفسه، لا على مستندك.
         لو قِستها على مستندك لحصلت الكلمةُ الغائبة عنه تمامًا على أعلى ندرة،
         فتُختار ضمن «الكلمات المميّزة» وهي مضمونة الغياب — عكس المقصود.
         على المرجع: «المؤسسة» ترد في كل مادة فتضعف، و«الاختراق» ترد في مادة
         واحدة فتقوى، وهي فعلًا الكلمة التي تحدد موضوع المتطلب. */
      var refWordSets = rSent.map(function (s2) { return contentWords(s2.text); });
      var df = {};
      refWordSets.forEach(function (rw) {
        var once = {};
        rw.forEach(function (w) { if (!once[w]) { once[w] = 1; df[w] = (df[w] || 0) + 1; } });
      });
      var N = Math.max(1, refWordSets.length);
      var idf = function (w) { return Math.log(1 + N / (1 + (df[w] || 0))); };

      /* السؤال: هل تعالج الإجراءات موضوع هذا المتطلب؟
         نقيسه على أميز ٦ كلمات في المتطلب (الأعلى ندرةً) لأن جملة المتطلب
         أطول عادةً من البند المقابل، فقياس كل كلماتها يظلم التغطية الحقيقية.
         الدليل المعروض يبقى البند الأقرب لفظًا. */
      var TOPK = 6;
      var docAll = {};
      docWords.forEach(function (dw) { dw.forEach(function (w) { docAll[w] = 1; }); });

      var reqs = rSent.filter(function (s) { return hasAny(s.text, C.deontic); }).map(function (s) {
        var need = contentWords(s.text).sort(function (a, b) { return idf(b) - idf(a); }).slice(0, TOPK);
        var total = need.reduce(function (a, w) { return a + idf(w); }, 0);
        var found = need.reduce(function (a, w) { return a + (docAll[w] ? idf(w) : 0); }, 0);
        var score = total ? found / total : 0;

        var best = 0, bestIdx = -1;
        docWords.forEach(function (dw, i) {
          if (!total) return;
          var hit = need.reduce(function (a, w) { return a + (dw.indexOf(w) > -1 ? idf(w) : 0); }, 0) / total;
          if (hit > best) { best = hit; bestIdx = i; }
        });

        return { requirement: refText.slice(rn.map[s.start], rn.map[Math.min(s.end, rn.map.length) - 1] + 1).trim(),
                 met: score >= COVER_THRESHOLD, score: Math.round(score * 100), terms: need,
                 matched: bestIdx > -1 ? quoteAt(sentences[bestIdx].start, sentences[bestIdx].end) : null };
      });

      if (reqs.length) {
        coverage = { requirements: reqs,
          score: Math.round(reqs.filter(function (r) { return r.met; }).length / reqs.length * 100) };
        reqs.filter(function (r) { return !r.met; }).forEach(function (r) {
          pushGap({ type: 'متطلب غير مغطى', title: 'متطلب من المرجع بلا ما يقابله',
            description: 'أقوى تطابق لفظي وجدناه في مستندك كان ' + r.score + '٪ فقط.',
            recommendation: 'أضف بندًا يقابل هذا المتطلب صراحةً.',
            evidence: r.requirement, evidenceType: 'reference',
            probability: sc.gapProbability.uncovered, impact: sc.gapImpact.uncovered, daysRemaining: null });
        });
        gaps.sort(function (a, b) { return b.risk - a.risk; });
      }
    }

    var stats = { critical: 0, medium: 0, low: 0 };
    gaps.forEach(function (g) { stats[g.severity]++; });

    var allRisks = gaps.map(function (g) { return g.risk; })
                     .concat(preds.map(function (p) { return p.risk; }));
    var riskScore = aggregateRisk(allRisks, sc);
    // القيمة غير المدوَّرة تُحفظ في تاريخ المستند، فيظهر منحنى الخطر متصلًا
    // بدل أن تبتلع التقريبُ حركةَ يومٍ واحد.
    var riskExact = allRisks.length
      ? Math.max.apply(null, allRisks) * sc.aggregate.maxWeight +
        Math.sqrt(allRisks.reduce(function (a, x) { return a + x * x; }, 0) / allRisks.length) * sc.aggregate.rmsWeight
      : 0;

    /* أكواد تتبّع ثابتة — نفس البند يحمل نفس الكود في كل تحليل لاحق.
       أي تصادم متبقٍ يُفَك بلاحقة ترتيبية، وهي ثابتة ما دام النص ثابتًا. */
    function uniqueKeys(items) {
      var seen = {};
      items.forEach(function (it) {
        var k = it.key;
        if (seen[k] === undefined) { seen[k] = 0; return; }
        seen[k]++; it.key = k + '#' + seen[k];
      });
    }
    var fp = fingerprint(norm);
    uniqueKeys(gaps);
    uniqueKeys(obligations);
    preds.forEach(function (p) {
      var ob = obligations.filter(function (o) { return o.index === p.obIndex; })[0];
      if (ob) p.obKey = ob.key;
    });
    gaps.forEach(function (g) { g.code = makeCode('G', fp, g.key); });
    obligations.forEach(function (o) { o.code = makeCode('OB', fp, o.key); });
    preds.forEach(function (p) { p.code = makeCode('DL', fp, p.obKey); });

    return {
      riskScore: riskScore, riskExact: riskExact, stats: stats, gaps: gaps, preds: preds,
      obligations: obligations.sort(function (a, b) {
        var x = a.daysRemaining === null ? 1e9 : a.daysRemaining;
        var y = b.daysRemaining === null ? 1e9 : b.daysRemaining;
        return x - y;
      }),
      clauseReport: clauseReport, coverage: coverage,
      docPenalty: docPenalty, contractValue: contractValue, docType: opts.docType || null,
      anchorDate: anchor ? { raw: anchor.raw, iso: new Date(anchor.ts).toISOString().slice(0, 10), approx: anchor.approx } : null,
      counts: { sentences: sentences.length, dates: dates.length, durations: durations.length, chars: text.length },
      fingerprint: fp,
      generatedAt: Date.now()
    };
  }

  function fingerprint(norm) {
    var n = norm.slice(0, 40000), h = 0;
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) | 0;
    return 'fp' + Math.abs(h).toString(36) + '_' + n.length;
  }

  /* موضع اقتباس في النص الأصلي — لإبرازه في العارض */
  function locateQuote(sourceText, quote) {
    if (!quote || !sourceText) return null;
    var nm = normMap(sourceText), q = normStr(quote);
    if (q.length < 8) return null;
    var k = nm.norm.indexOf(q);
    if (k === -1) {
      var head = q.slice(0, 40);
      if (head.length < 12) return null;
      k = nm.norm.indexOf(head);
      if (k === -1) return null;
      q = head;
    }
    return { start: nm.map[k], end: nm.map[Math.min(k + q.length - 1, nm.map.length - 1)] + 1 };
  }

  return {
    analyze: analyze, locateQuote: locateQuote, normStr: normStr, normMap: normMap,
    findDates: findDates, findDurations: findDurations, splitSentences: splitSentences,
    NUM_WORDS: NUM_WORDS,
    hijriToUTC: hijriToUTC, todayUTC: todayUTC,
    timeDecay: timeDecay, itemRisk: itemRisk, aggregateRisk: aggregateRisk, curve: curve,
    nistRisk: nistRisk, nistBand: nistBand, moneyImpact: moneyImpact,
    sevFromRisk: sevFromRisk, probFromDays: probFromDays, urgencyLabel: urgencyLabel,
    makeCode: makeCode, shortHash: shortHash, compile: compile,
    stem: stem, contentWords: contentWords, normList: normList, hasAny: hasAny
  };
});
</script>
<script>/* نذير — سجل التتبّع. يقيّد كل تحليل وكل تعديل على الإعدادات وكل دخول،
   بكود متسلسل قابل للإحالة. يُخزَّن محليًا ويُصدَّر كملف JSON. */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.NadheerAudit = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var KEY = 'nadheer:audit:v1', SEQ = 'nadheer:seq:v1', MAX = 800;
  var mem = null;                       // بديل عند منع التخزين

  function read() {
    if (mem) return mem;
    try { return JSON.parse(window.localStorage.getItem(KEY) || '[]'); }
    catch (e) { mem = mem || []; return mem; }
  }
  function write(list) {
    if (list.length > MAX) list = list.slice(-MAX);
    try { window.localStorage.setItem(KEY, JSON.stringify(list)); mem = null; }
    catch (e) { mem = list; }
    return list;
  }

  /* رقم متسلسل سنوي: NR-2026-0001 */
  function nextCode(prefix) {
    var year = new Date().getFullYear(), n = 1;
    try {
      var st = JSON.parse(window.localStorage.getItem(SEQ) || '{}');
      if (st.year !== year) st = { year: year, n: 0 };
      st.n++; n = st.n;
      window.localStorage.setItem(SEQ, JSON.stringify(st));
    } catch (e) {
      n = read().filter(function (e2) { return e2.code && e2.code.indexOf(prefix + '-' + year) === 0; }).length + 1;
    }
    return prefix + '-' + year + '-' + ('000' + n).slice(-4);
  }

  var KINDS = { analysis: 'تحليل', config: 'تعديل إعدادات', auth: 'دخول',
                security: 'أمان', data: 'بيانات' };

  function log(entry) {
    var list = read();
    var rec = {
      id: 'e' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36),
      at: Date.now(),
      kind: entry.kind || 'data',
      kindLabel: KINDS[entry.kind] || 'حدث',
      actor: entry.actor || 'مجهول',
      title: entry.title || '',
      detail: entry.detail || '',
      changes: entry.changes || null,
      code: entry.code || null,
      meta: entry.meta || null
    };
    list.push(rec);
    write(list);
    return rec;
  }

  function list(filter) {
    var out = read().slice().reverse();
    if (filter && filter.kind && filter.kind !== 'all') {
      out = out.filter(function (e) { return e.kind === filter.kind; });
    }
    if (filter && filter.q) {
      var q = filter.q.toLowerCase();
      out = out.filter(function (e) {
        return (e.title + ' ' + e.detail + ' ' + (e.code || '') + ' ' + e.actor).toLowerCase().indexOf(q) > -1;
      });
    }
    return out;
  }

  function stats() {
    var all = read(), s = { total: all.length, analysis: 0, config: 0, auth: 0, lastAt: null };
    all.forEach(function (e) { if (s[e.kind] !== undefined) s[e.kind]++; });
    if (all.length) s.lastAt = all[all.length - 1].at;
    return s;
  }

  /* تتبّع كود بند عبر كل التحاليل التي ظهر فيها */
  function traceCode(code) {
    return read().filter(function (e) {
      return e.meta && e.meta.codes && e.meta.codes.indexOf(code) > -1;
    }).reverse();
  }

  function clear() { try { window.localStorage.removeItem(KEY); } catch (e) {} mem = null; }

  return { log: log, list: list, stats: stats, clear: clear, nextCode: nextCode,
           traceCode: traceCode, KINDS: KINDS, all: read };
});
</script>
<script>/* نذير — مخزن المستندات. يحفظ نص كل مستند ومهامه وتاريخ خطره،
   حتى يُعاد تحليله كل يوم بتاريخ اليوم فيتحرك الخطر مع اقتراب المواعيد. */
(function (root, factory) {
  var api = factory();

     لمصطلحٍ واحد بلا تداخل — وهما في الحقيقة المصطلح نفسه. */
  /* لا نستعمل \b هنا: حدُّ الكلمة في JS معرَّفٌ على [A-Za-z0-9_] وحدها،
     فكل حرفٍ عربي «غير كلمة» عنده ولا يقع بينه وبين الفراغ حدّ — فالنمط
     لا يطابق شيئًا أبدًا. النظرةُ الأمامية للفراغ تقوم مقامه. */
  var DEF_STOP = /\s+(?:اذا|اذ|انه|بانه|هو|هي|كل|التي|الذي|ما|عندما|متي|حين|في حال|كلما)(?=\s|$)/;

  function definedTerm(norm, markers) {
    for (var i = 0; i < markers.length; i++) {
      var at = norm.indexOf(markers[i]);
      if (at < 0) continue;
      var tail = norm.slice(at + markers[i].length, at + markers[i].length + 70);
      var q = tail.match(/^\s*[«"']([^»"']{2,40})[»"']/);
      var termText = q ? q[1] : tail.split(DEF_STOP)[0];
      // المصطلح اسمٌ لا جملة: خمس كلمات سقفًا
      var ws = E.contentWords(String(termText).split(/[،؛\.\n:]/)[0]).slice(0, 5);
      if (ws.length) {
        return { marker: markers[i], words: ws, at: at,
                 body: norm.slice(at, at + 260) };
      }
    }
    return null;
  }

  /* الترتيب: أقربُ مرساةٍ إلى لفظ «قبل» أو «بعد» هي التي يصفها. بلا هذا
     القيد تلتقط جملةٌ فيها «قبل التوقيع» و«بعد الإصدار» ترتيبين متضاربين
     من نفسها. */
  /* «التوقيع» و«توقيع» مرساةٌ واحدة: بلا تجريد الألف واللام يخرج ترتيبان
     مختلفان عن الحدث نفسه فلا يلتقيان أبدًا. */
  var bareAnchor = function (a) { return a.replace(/^ال/, ''); };

  function ordering(norm, seq) {
    var best = null;
    [['before', seq.before], ['after', seq.after]].forEach(function (pair) {
      pair[1].forEach(function (rel) {
        var from = 0, at;
        while ((at = norm.indexOf(rel, from)) > -1) {
          from = at + 1;
          // «قبل ثلاثين يوماً من التوقيع» ترتيبٌ أيضًا، فنمدّ نافذة البحث
          var win = norm.slice(at + rel.length, at + rel.length + 46);
          seq.anchors.forEach(function (anc) {
            var d = win.indexOf(anc);
            if (d < 0) return;
            if (!best || d < best.dist) {
              best = { rel: pair[0], relTerm: rel,
                       anchor: bareAnchor(anc), dist: d };
            }
          });
        }
      });
    });
    return best;
  }

  var fmtQ = function (q, norm) { return norm.slice(q.s, q.e).trim(); };

  /* التطبيع يحذف التشكيل، فالخريطة تقف عند آخر حرف أصلي وتترك «ً» خارجه.
     نمدّ المقطع ليشمل ما يلحقه من تشكيل حتى يخرج «يوماً» لا «يوما». */
  function origSpan(text, map, s0, e0) {
    var a = map[s0], b = map[Math.min(e0, map.length) - 1] + 1;
    while (b < text.length && /[\u064B-\u0652\u0640]/.test(text[b])) b++;
    return text.slice(a, b);
  }

  function detect(opts) {
    var raw = cfgOf(opts.config);
    var C = {
      proh: E.normList(raw.conflict.prohibitions),
      imp:  E.normList(raw.conflict.impositions),
      perm: E.normList(raw.conflict.permissions),
      req:  E.normList(raw.deontic)
    };
    var minScore = raw.conflict.minTopicScore;

    var dn = E.normMap(opts.docText || ''), rn = E.normMap(opts.refText || '');
    if (!rn.norm.trim() || !dn.norm.trim()) return { conflicts: [], reason: 'no-ref' };

    var dS = E.splitSentences(dn.norm), rS = E.splitSentences(rn.norm);
    var quote = function (map, text, s) {
      return text.slice(map[s.start], map[Math.min(s.end, map.length) - 1] + 1).trim();
    };

    // الندرة تُقاس على المرجع نفسه — الكلمة الغائبة عن سياستك ليست «مميزة»
    var refSets = rS.map(function (s) { return E.contentWords(s.text); });
    var df = {};
    refSets.forEach(function (ws) {
      var once = {};
      ws.forEach(function (w) { if (!once[w]) { once[w] = 1; df[w] = (df[w] || 0) + 1; } });
    });
    var N = Math.max(1, refSets.length);
    var idf = function (w) { return Math.log(1 + N / (1 + (df[w] || 0))); };

    var docSets = dS.map(function (s) { return E.contentWords(s.text); });
    var docCls = dS.map(function (s) { return classify(s.text, C); });
    var cues = dirCues(raw.conflict.direction);
    var out = [];

    /* جملةُ التعريف تُعلَّم قبل القاعدة الحدّية: مقاديرها بوابات نطاق
       لا حدود التزام، فتُقرأ بعكس اتجاهها. */
    var DF = {
      mk: E.normList(raw.conflict.definition.markers),
      uni: E.normList(raw.conflict.definition.universals)
    };
    var rIsDef = rS.map(function (s) { return !!definedTerm(s.text, DF.mk); });
    var dIsDef = dS.map(function (s) { return !!definedTerm(s.text, DF.mk); });

    /* ── القاعدة (ج): تعارض حدّي ── */
    rS.forEach(function (rs, ri) {
      var refQs = quantities(rn.norm, rs.start, rs.end, cues, rIsDef[ri]);
      if (!refQs.length) return;
      var need = refSets[ri].slice().sort(function (a, b) { return idf(b) - idf(a); }).slice(0, TOPK);
      if (!need.length) return;

      dS.forEach(function (ds, di) {
        var score = topicScore(need, docSets[di], idf);
        if (score < minScore) return;
        var docQs = quantities(dn.norm, ds.start, ds.end, cues, dIsDef[di]);
        if (!docQs.length) return;

        /* الاقتران بالترتيب لا بالضرب الديكارتي: جملة تحمل «الإبلاغ خلال
           ٢٤ ساعة وتقديم التقرير خلال ٥ أيام» يجب أن تُقارن الأولى بالأولى
           والثانية بالثانية — وإلا قُورن التقرير بمهلة الإبلاغ فخرج تعارض
           وهمي. */
        var byKind = function (list, k) { return list.filter(function (q) { return q.kind === k; }); };
        var pairs = [];
        ['مدة', 'مبلغ', 'نسبة'].forEach(function (k) {
          var rs2 = byKind(refQs, k), ds2 = byKind(docQs, k);
          for (var i = 0; i < Math.min(rs2.length, ds2.length); i++) pairs.push([rs2[i], ds2[i]]);
        });
        pairs.forEach(function (pr) {
          var rq = pr[0], dq = pr[1];
          (function () {
            var why = violates(rq, dq);
            if (!why) return;
            var refQ = quote(rn.map, opts.refText, rs), docQ = quote(dn.map, opts.docText, ds);
            out.push({
              rule: 'حدّي', kind: 'قيمة تخالف حدًّا في المرجع', why: why,
              score: Math.round(score * 100),
              refQuote: refQ, refArticle: articleOf(refQ),
              docQuote: docQ, docArticle: articleOf(docQ),
              subject: fmtQ(dq, dn.norm), core: need.slice(0, 3).join(' '),
              amount: null, topic: need,
              quantity: {
                kind: rq.kind, dir: rq.dir,
                refText: fmtQ(rq, rn.norm), docText: fmtQ(dq, dn.norm),
                refBase: rq.base, docBase: dq.base,
                docOrig: origSpan(opts.docText, dn.map, dq.s, dq.e),
                refOrig: origSpan(opts.refText, rn.map, rq.s, rq.e),
                docShow: origSpan(opts.docText, dn.map, dq.s, dq.e).replace(/\s+/g, ' '),
                refShow: origSpan(opts.refText, rn.map, rq.s, rq.e).replace(/\s+/g, ' ')
              },
              key: E.normStr(docQ).slice(0, 70) + '|' + dq.s
            });
          })();
        });
      });
    });

    rS.forEach(function (rs, ri) {
      var rc = classify(rs.text, C);
      if (!rc.prohibits && !rc.requires) return;
      var need = refSets[ri].slice().sort(function (a, b) { return idf(b) - idf(a); }).slice(0, TOPK);
      if (!need.length) return;

      dS.forEach(function (ds, di) {
        var dc = docCls[di];
        // تعارض حقيقي: المرجع يمنع وسياستك تفرض، أو المرجع يوجب وسياستك تمنع
        var kind = (rc.prohibits && dc.imposes) ? 'يمنعه المرجع وسياستك تفرضه'
                 : (rc.prohibits && dc.permits) ? 'يمنعه المرجع وسياستك تُجيزه'
                 : (rc.requires && dc.prohibits) ? 'يوجبه المرجع وسياستك تمنعه' : null;
        if (!kind) return;
        /* بندٌ يمنع شيئًا قد يكون تنفيذًا للمتطلب لا مخالفةً له («لا يجوز
           التعاقد قبل تقييم المخاطر» ينفّذ متطلبَ التقييم). فنرفع عتبته
           ونعلّمه «محتمل» ليراجعه الإنسان بدل أن يُعدَّل تلقائيًا. */
        var tentative = kind.indexOf('تمنعه') > -1;
        var score = topicScore(need, docSets[di], idf);
        if (score < (tentative ? raw.conflict.minTopicScoreTentative : minScore)) return;

        var refQ = quote(rn.map, opts.refText, rs), docQ = quote(dn.map, opts.docText, ds);
        var subject = subjectOf(docQ), amount = amountOf(docQ);
        out.push({
          rule: 'فعل', kind: kind, tentative: tentative, score: Math.round(score * 100),
          refQuote: refQ, refArticle: articleOf(refQ),
          docQuote: docQ, docArticle: articleOf(docQ),
          subject: subject, core: coreOf(subject), amount: amount,
          topic: need,
          key: E.normStr(docQ).slice(0, 70)
        });
      });
    });

    /* ── القاعدة (د): تعارض النطاق ──
       المرجع يُدخل جهةً في النطاق وسياستك تُخرجها. */
    var SC = {
      inc: E.normList(raw.conflict.scope.includes),
      exc: E.normList(raw.conflict.scope.excludes)
    };
    rS.forEach(function (rs, ri) {
      var rInc = entityAfter(rs.text, SC.inc);
      if (!rInc) return;
      var need = refSets[ri].slice().sort(function (a, b) { return idf(b) - idf(a); }).slice(0, TOPK);
      if (!need.length) return;

      dS.forEach(function (ds, di) {
        var dExc = entityAfter(ds.text, SC.exc);
        if (!dExc) return;
        // الجهة نفسها لا جهة أخرى: «تُستثنى الفروع» لا تعارض «تشمل التابعة»
        var ent = overlap(rInc.words, dExc.words);
        if (ent < raw.conflict.scope.minEntityOverlap) return;
        var score = topicScore(need, docSets[di], idf);
        if (score < raw.conflict.scope.minTopicScore) return;

        var refQ = quote(rn.map, opts.refText, rs), docQ = quote(dn.map, opts.docText, ds);
        out.push({
          rule: 'نطاق', kind: 'يشمله المرجع وسياستك تستثنيه',
          why: 'المرجع يُدخل «' + rInc.text + '» في النطاق، وسياستك تُخرجه',
          score: Math.round(Math.min(score, ent) * 100),
          refQuote: refQ, refArticle: articleOf(refQ),
          docQuote: docQ, docArticle: articleOf(docQ),
          subject: dExc.text, core: dExc.text, amount: null, topic: need,
          scope: { includeTerm: rInc.term, excludeTerm: dExc.term,
                   entity: dExc.text, refEntity: rInc.text },
          key: E.normStr(docQ).slice(0, 70) + '|نطاق'
        });
      });
    });

    /* ── القاعدة (هـ): تعارض التعريف ──
       المصطلح نفسه معرَّفٌ في الوثيقتين تعريفين مختلفين. لا نرفع كل
       اختلاف صياغة، بل الاختلاف الذي يُضيّق: المرجع يعمّم صراحةً
       («بصرف النظر عن قيمته») وسياستك تقيّده بعتبة. */
    rS.forEach(function (rs) {
      var rDef = definedTerm(rs.text, DF.mk);
      if (!rDef) return;
      var refUniversal = E.hasAny(rDef.body, DF.uni);
      if (!refUniversal) return;   // بلا تعميمٍ صريح لا نحكم على التضييق

      dS.forEach(function (ds) {
        var dDef = definedTerm(ds.text, DF.mk);
        if (!dDef) return;
        var term = overlap(rDef.words, dDef.words);
        if (term < raw.conflict.definition.minTermOverlap) return;
        // التضييق يظهر عتبةً: مقدارٌ في تعريف سياستك غائبٌ عن تعميم المرجع
        var dq = quantities(dn.norm, ds.start, ds.end, cues);
        if (!dq.length) return;
        if (E.hasAny(dDef.body, DF.uni)) return;   // سياستك تعمّم أيضًا

        var refQ = quote(rn.map, opts.refText, rs), docQ = quote(dn.map, opts.docText, ds);
        var termTxt = rDef.words.join(' ');
        out.push({
          rule: 'تعريف', kind: 'تعريف أضيق مما في المرجع',
          why: 'المرجع يعمّم التعريف، وسياستك تقيّده بعتبة ' + fmtQ(dq[0], dn.norm),
          score: Math.round(term * 100),
          refQuote: refQ, refArticle: articleOf(refQ),
          docQuote: docQ, docArticle: articleOf(docQ),
          subject: termTxt, core: termTxt, amount: null, topic: rDef.words,
          definition: { term: termTxt, threshold: fmtQ(dq[0], dn.norm) },
          key: E.normStr(docQ).slice(0, 70) + '|تعريف'
        });
      });
    });

    /* ── القاعدة (و): تعارض التسلسل ──
       الإجراء نفسه والمرساة نفسها، والترتيب مقلوب: رقابةٌ كانت شرطًا
       سابقًا صارت إخطارًا لاحقًا. */
    var SQ = {
      before: E.normList(raw.conflict.sequence.before),
      after: E.normList(raw.conflict.sequence.after),
      anchors: E.normList(raw.conflict.sequence.anchors)
    };
    rS.forEach(function (rs, ri) {
      var rOrd = ordering(rs.text, SQ);
      if (!rOrd || rOrd.rel !== 'before') return;   // التقديم وحده هو الضمانة
      // الترتيب لا يُحتجّ به إلا إن كان المرجع يوجبه أو يمنعه
      var rcSeq = classify(rs.text, C);
      if (!rcSeq.requires && !rcSeq.prohibits) return;
      var need = refSets[ri].slice().sort(function (a, b) { return idf(b) - idf(a); }).slice(0, TOPK);
      if (!need.length) return;

      dS.forEach(function (ds, di) {
        var dOrd = ordering(ds.text, SQ);
        if (!dOrd || dOrd.rel !== 'after') return;
        if (dOrd.anchor !== rOrd.anchor) return;    // المرساة نفسها
        /* الجذور المشتركة تُقاس بعددها لا بتغطيتها: البندان يتحدثان عن
           العقد والإسناد والجهة الرقابية نفسها وإن اختلفت آليتهما. */
        var shared = refSets[ri].filter(function (w) {
          return docSets[di].indexOf(w) > -1;
        }).length;
        if (shared < raw.conflict.sequence.minSharedStems) return;
        var score = topicScore(need, docSets[di], idf);

        var refQ = quote(rn.map, opts.refText, rs), docQ = quote(dn.map, opts.docText, ds);
        out.push({
          rule: 'تسلسل', tentative: true, rank: shared,
          kind: 'المرجع يوجبه قبل، وسياستك تجعله بعد',
          why: 'المرجع يشترطه قبل «' + rOrd.anchor + '»، وسياستك تجعله بعده',
          score: Math.round(score * 100),
          refQuote: refQ, refArticle: articleOf(refQ),
          docQuote: docQ, docArticle: articleOf(docQ),
          subject: rOrd.anchor, core: rOrd.anchor, amount: null, topic: need,
          sequence: { anchor: rOrd.anchor, refRel: rOrd.relTerm, docRel: dOrd.relTerm },
          key: E.normStr(docQ).slice(0, 70) + '|تسلسل'
        });
      });
    });

    /* ── القاعدة (ز): الإفراغ بالغموض ──
       البند حاضرٌ في سياستك لفظًا، لكنه معلَّق على تقديرٍ مطلق بعد أن كان
       في المرجع شاملًا واجبًا. أخطر من الغياب: الغياب يُرى في الجرد،
       وهذا يمرّ على أنه تغطية. */
    var HV = E.normList(raw.conflict.hollowing.universals);
    var vagueList = E.normList((raw.vague || []).map(function (v) { return v.term; }));
    rS.forEach(function (rs, ri) {
      var rc = classify(rs.text, C);
      if (!rc.requires && !rc.prohibits) return;
      if (!E.hasAny(rs.text, HV)) return;          // المرجع شامل صراحةً
      if (E.hasAny(rs.text, vagueList)) return;    // مرجعٌ غامضٌ لا يُفرَّغ
      var need = refSets[ri].slice().sort(function (a, b) { return idf(b) - idf(a); }).slice(0, TOPK);
      if (!need.length) return;

      dS.forEach(function (ds, di) {
        var vague = E.hasAny(ds.text, vagueList);
        if (!vague) return;
        if (E.hasAny(ds.text, HV)) return;          // سياستك شاملة أيضًا
        var shared = refSets[ri].filter(function (w) {
          return docSets[di].indexOf(w) > -1;
        }).length;
        if (shared < raw.conflict.hollowing.minSharedStems) return;
        var score = topicScore(need, docSets[di], idf);

        var refQ = quote(rn.map, opts.refText, rs), docQ = quote(dn.map, opts.docText, ds);
        out.push({
          rule: 'إفراغ', rank: shared,
          kind: 'التزام شامل في المرجع صار تقديريًا في سياستك',
          why: 'المرجع يوجبه شمولًا، وسياستك تعلّقه على «' + vague + '»',
          score: Math.round(score * 100),
          refQuote: refQ, refArticle: articleOf(refQ),
          docQuote: docQ, docArticle: articleOf(docQ),
          subject: vague, core: vague, amount: null, topic: need,
          hollowing: { vagueTerm: vague },
          key: E.normStr(docQ).slice(0, 70) + '|إفراغ'
        });
      });
    });

    /* بند واحد قد يعارض عدة مواد — نُبقي أقوى تطابق لكل بند.
       والقوة تُقاس بما استُدلّ به فعلًا: قاعدتا التسلسل والإفراغ تحكمان
       بعدد الجذور المشتركة لا بتغطية أندر الكلمات، فترتيبُهما به. بلا
       ذلك تُنسب المخالفة إلى مادةٍ مرجعية أخرى تصادف أن فيها اللفظ
       نفسه — رأينا تعارض «عدم الممانعة» يُنسب إلى مادة خطة الخروج. */
    var rankOf = function (c) { return c.rank !== undefined ? c.rank : c.score; };
    var best = {};
    out.forEach(function (c) {
      if (!best[c.key] || rankOf(c) > rankOf(best[c.key])) best[c.key] = c;
    });
    var list = Object.keys(best).map(function (k) { return best[k]; })
                 .sort(function (a, b) { return b.score - a.score; });

    var fp = E.normStr(opts.docText).slice(0, 40000);
    var seen = {};
    list.forEach(function (c) {
      var code = E.makeCode('CF', fp, c.key);
      // تصادم في اختصار البصمة ممكن؛ نفكّه بلاحقة ثابتة الترتيب
      if (seen[code] !== undefined) { seen[code]++; code = code + '-' + seen[code]; }
      else seen[code] = 0;
      c.code = code;
    });
    return { conflicts: list };
  }

  /* ═══ مسودة البند البديل ═══ */
  function proposeClause(c, vars) {
    var v = vars || {};
    var ref = (c.refArticle ? c.refArticle + ' من ' : '') + (v.refName || 'المرجع التنظيمي');
    var art = c.docArticle || 'هذا البند';

    /* التعارض الحدّي يُصلَح بأدق تدخّل ممكن: استبدال المقدار داخل جملتك
       نفسها. يبقى النص بأسلوبك، ولا نعيد صياغة ما لم يُطلب تغييره. */
    if (c.rule === 'حدّي') {
      var q = c.quantity;
      var body = c.docQuote.indexOf(q.docOrig) > -1
        ? c.docQuote.replace(q.docOrig, q.refOrig)
        : null;
      if (body) {
        return art + ' (معدَّلة):\n' + body.replace(/\s+/g, ' ').trim() +
          '\n(عُدِّل «' + q.docOrig + '» إلى «' + q.refOrig + '» التزامًا بـ' + ref + '.)';
      }
      return art + ' (معدَّلة):\n' + c.docQuote.replace(/\s+/g, ' ').trim() +
        '\nعلى أن تكون القيمة «' + q.refOrig + '» بدلًا من «' + q.docOrig +
        '»، التزامًا بـ' + ref + '.';
    }
    /* لكل قاعدةٍ إصلاحُها: التعارض في النطاق يُصلَح بردّ الجهة المستثناة،
       وفي التعريف بتبنّي تعريف المرجع، وفي التسلسل بإعادة الإجراء إلى
       ما قبل الحدث، وفي الإفراغ بإزالة التقدير. صيغةٌ عامة واحدة تصلح
       لجميعها تقول للمحرِّر أقلَّ مما يعرفه المحرك. */
    if (c.rule === 'نطاق') {
      return art + ' (معدَّلة):\n' +
        c.docQuote.replace(/\s+/g, ' ').trim() +
        '\nعلى أن يشمل النطاق «' + c.scope.refEntity + '» دون استثناء، التزامًا بـ' + ref + '.\n' +
        '(حُذف استثناء «' + c.scope.entity + '».)';
    }
    if (c.rule === 'تعريف') {
      return art + ' (معدَّلة):\n' +
        'يُعتمد في تعريف «' + c.definition.term + '» ما ورد في ' + ref + ' دون تقييده بعتبة مالية.\n' +
        '(أُلغيت عتبة «' + c.definition.threshold + '»، فالمرجع يعمّم التعريف بصرف النظر عن القيمة.)';
    }
    if (c.rule === 'تسلسل') {
      return art + ' (معدَّلة):\n' +
        c.docQuote.replace(/\s+/g, ' ').trim() +
        '\nعلى أن يتم الإجراء المقرر في ' + ref + ' قبل «' + c.sequence.anchor + '» لا بعده.\n' +
        '(الرقابة سابقة لا لاحقة — راجِع الصياغة قبل الاعتماد.)';
    }
    if (c.rule === 'إفراغ') {
      /* لا نستبدل العبارة في النص: اللفظ المرصود مطبَّعٌ («عند الحاجه»)
         والنص خام («عند الحاجة»)، فالاستبدال يخفق صامتًا ويخرج البند
         كما هو موهمًا أنه عُدِّل. نذكرها في الملاحظة ليحذفها المحرِّر. */
      return art + ' (معدَّلة):\n' +
        c.docQuote.replace(/\s+/g, ' ').trim() +
        '\nويكون الالتزام واجبًا في جميع الحالات دون تعليقٍ على التقدير، التزامًا بـ' + ref + '.\n' +
        '(حُذفت عبارة «' + c.hollowing.vagueTerm + '» لأنها تُفرغ الالتزام.)';
    }
    if (c.kind.indexOf('تُجيزه') > -1) {
      return art + ' (معدَّلة):\n' +
        'لا يجوز ' + c.core + '، التزامًا بما ورد في ' + ref + '.\n' +
        'ويُلغى كل ما يخالف ذلك في هذا البند اعتبارًا من ' +
        (v.effectiveDate || '[تاريخ النفاذ]') + '.';
    }
    if (c.kind.indexOf('تفرضه') > -1) {
      return art + ' (معدَّلة):\n' +
        'لا تُفرض أي رسوم أو عمولات أو مقابل مالي على ' + c.core + '، ' +
        'التزامًا بما ورد في ' + ref + '.\n' +
        (c.amount ? 'وتُلغى الرسوم البالغة ' + c.amount + ' المنصوص عليها سابقًا، ' : 'وتُلغى الرسوم المنصوص عليها سابقًا، ') +
        'ويُوقف تحصيلها اعتبارًا من ' + (v.effectiveDate || '[تاريخ النفاذ]') + '.';
    }
    return art + ' (معدَّلة):\n' +
      'يُلتزم بما ورد في ' + ref + ' بشأن ' + c.core + '، ' +
      'ويُلغى كل ما يخالف ذلك في هذا البند اعتبارًا من ' +
      (v.effectiveDate || '[تاريخ النفاذ]') + '.';
  }

  /* ═══ مسودة التعميم الداخلي ═══ */
  function buildCircular(conflicts, vars) {
    var v = vars || {};
    var org = v.org || '[اسم الجهة]';
    var num = v.number || '[رقم التعميم]';
    var date = v.date || new Date().toISOString().slice(0, 10);
    var eff = v.effectiveDate || '[تاريخ النفاذ]';
    var owner = v.owner || '[الإدارة المختصة]';
    var days = v.days || '30';
    var subject = conflicts.length === 1
      ? (conflicts[0].rule === 'حدّي' ? 'قيمة مخالفة للمرجع التنظيمي' : conflicts[0].core)
      : 'بنود السياسة المخالفة للمرجع التنظيمي';

    var t = '';
    t += '⚠ مسودة — لم تُعتمد بعد. تُراجَع قانونيًا وتُعتمد قبل الإصدار.\n';
    t += Array(64).join('─') + '\n\n';
    t += org + '\n';
    t += 'تعميم داخلي رقم ' + num + '\n';
    t += 'التاريخ: ' + date + '\n';
    t += 'الموضوع: تعديل ' + subject + ' بما يوافق ' + (v.refName || 'المرجع التنظيمي') + '\n\n';
    t += Array(64).join('─') + '\n\n';

    var n2 = conflicts.length;
    var countPhrase = n2 === 1 ? 'بندٍ واحد يخالف'
                    : n2 === 2 ? 'بندين يخالفان'
                    : n2 + ' بنودٍ تخالف';
    t += 'استنادًا إلى ' + (v.refName || 'المرجع التنظيمي') + '، وبعد مراجعة السياسة الداخلية ' +
         (v.docName ? '«' + v.docName + '»' : '') + '، تبيّن وجود ' + countPhrase + ' ما ورد في المرجع.\n\n';

    conflicts.forEach(function (c, i) {
      t += (conflicts.length > 1 ? '(' + (i + 1) + ') ' : '') + 'حيث نص ' +
           (c.refArticle ? c.refArticle + ' من المرجع' : 'المرجع') + ' على:\n';
      t += '    «' + c.refQuote.replace(/\s+/g, ' ') + '»\n\n';
      t += 'وحيث ' + (c.docArticle ? 'نصت ' + c.docArticle + ' من السياسة' : 'نصت السياسة') + ' على:\n';
      t += '    «' + c.docQuote.replace(/\s+/g, ' ') + '»\n\n';
    });

    t += Array(64).join('─') + '\n';
    t += 'يُعمَّم على جميع القطاعات والفروع ما يلي:\n\n';
    var n = 1;
    conflicts.forEach(function (c) {
      if (c.rule === 'حدّي') {
        t += (n++) + '. تُعدَّل «' + c.quantity.docOrig + '» إلى «' + c.quantity.refOrig + '» في ' +
             (c.docArticle || 'البند المشار إليه') + '، اعتبارًا من ' + eff + '.\n';
      } else if (c.kind.indexOf('تفرضه') > -1) {
        t += (n++) + '. يُوقف فورًا تحصيل ' + c.subject +
             (c.amount ? ' البالغة ' + c.amount : '') + '، وتُعدّ ملغاة اعتبارًا من ' + eff + '.\n';
      } else {
        t += (n++) + '. يُلتزم بما ورد في المرجع بشأن ' + c.core + ' اعتبارًا من ' + eff + '.\n';
      }
    });
    t += (n++) + '. على ' + owner + ' تحديث الأنظمة والنماذج وقوائم التعرفة خلال ' + days + ' يومًا من تاريخه.\n';
    t += (n++) + '. تُعاد أي مبالغ حُصّلت بعد ' + eff + ' خلافًا لهذا التعميم.\n';
    t += (n++) + '. يُعدّ هذا التعميم جزءًا لا يتجزأ من السياسة المشار إليها، ويُلغى كل ما يخالفه.\n\n';

    t += Array(64).join('─') + '\n';
    t += 'نص البنود بعد التعديل:\n\n';
    conflicts.forEach(function (c) { t += proposeClause(c, v) + '\n\n'; });

    t += Array(64).join('─') + '\n';
    t += 'للاعتماد:\n\n';
    t += '    المراجعة القانونية: ....................  التاريخ: ..........\n\n';
    t += '    الاعتماد:            ....................  التاريخ: ..........\n\n';
    t += 'أُنشئت هذه المسودة آليًا بواسطة نذير من مقارنة نصّي السياسة والمرجع.\n';
    t += 'الصياغة قالبية وتحتاج مراجعة بشرية — لا تُصدر قبل الاعتماد.\n';
    return t;
  }

  /* ═══ السياسة كاملة بعد استبدال البنود المتعارضة ═══ */
  function buildAmendedPolicy(docText, conflicts, vars, bare) {
    var v = vars || {}, out = docText, applied = 0;
    conflicts.forEach(function (c) {
      if (c.skip) return;
      var body = (c.editedProposal || proposeClause(c, v));
      var idx = out.indexOf(c.docQuote);
      if (idx === -1) return;                   // النص تغيّر بعد الكشف
      out = out.slice(0, idx) + body + out.slice(idx + c.docQuote.length);
      applied++;
    });
    // bare: نصٌّ بلا ترويسة، لإعادة تحميله في النظام وتحليله دون أن
    // تدخل كلماتُ الترويسة في التحليل.
    if (bare) return { text: out, applied: applied };
    var head = '⚠ مسودة معدَّلة — لم تُعتمد بعد. تُراجَع قانونيًا قبل الإصدار.\n' +
      'أُنشئت بواسطة نذير في ' + new Date().toISOString().slice(0, 10) +
      ' · عُدِّل ' + applied + ' من ' + conflicts.length + ' بندًا متعارضًا.\n' +
      Array(64).join('─') + '\n\n';
    return { text: head + out, applied: applied };
  }

  return { detect: detect, proposeClause: proposeClause,
           buildCircular: buildCircular, buildAmendedPolicy: buildAmendedPolicy,
           subjectOf: subjectOf, amountOf: amountOf };
});

<script>/* نذير — الواجهة. لا يوجد أي طلب شبكة في هذا الملف. */
(function () {
  'use strict';
  var E = window.NadheerEngine, NC = window.NadheerConfig,
      AU = window.NadheerAudit, ST = window.NadheerStore, CF = window.NadheerConflicts;

  var S = { session: null, cfg: null, cfgDraft: null, route: 'home',
            docs: [], analyses: {}, openDoc: null, docTab: 'sum',
            draft: { doc1: '', doc2: '', ctx: '', name: '', type: 'فحص كل البنود' }, files: {},
            batch: [],   // عدة مستندات تُحلَّل دفعةً واحدة مقابل مرجعٍ واحد
            gapFilter: 'all', planFilter: 'open', auditFilter: 'all', auditQ: '',
            storageOK: true, sourceText: '', banner: null };

  /* ═══ أدوات ═══ */
  var esc = function (s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var $ = function (i) { return document.getElementById(i); };
  /* يربط حدثًا على كل ما يطابق المحدِّد داخل عنصر. يغني عن حلقة يدوية
     وغلاف IIFE في كل موضع ربط — وكانت ثلاثة عشر. */
  function on(root, sel, ev, fn) {
    Array.prototype.forEach.call((root || document).querySelectorAll(sel), function (n) {
      n.addEventListener(ev, function (e) { fn(n, e); });
    });
  }
  var sevColor = function (s) { return s === 'critical' ? 'var(--danger)' : s === 'medium' ? 'var(--warning)' : 'var(--success)'; };
  var sevLabel = function (s) { return s === 'critical' ? 'حرجة' : s === 'medium' ? 'متوسطة' : 'منخفضة'; };
  var sevBadge = function (s) { return s === 'critical' ? 'high' : s === 'medium' ? 'med' : 'low'; };
  var riskColor = function (r) {
    var t = (S.cfg || NC.DEFAULTS).scoring.thresholds;
    return r >= t.critical ? 'var(--danger)' : r >= t.medium ? 'var(--warning)' : 'var(--success)';
  };
  var riskWord = function (r) {
    var t = (S.cfg || NC.DEFAULTS).scoring.thresholds;
    return r >= t.critical ? 'مرتفع' : r >= t.medium ? 'متوسط' : 'منخفض';
  };
  var fmtDate = function (ts) {
    var d = new Date(ts);
    return d.toISOString().slice(0, 10) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  };
  var STATUS = { todo: 'لم يبدأ', doing: 'قيد التنفيذ', done: 'مكتمل' };

  var I = {
    doc:'<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/>',
    docs:'<path d="M15 2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V6z"/><path d="M15 2v4h4"/><path d="M3 7v13a2 2 0 0 0 2 2h9"/>',
    shield:'<path d="M12 2l8 4v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
    lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    burger:'<path d="M3 6h18M3 12h18M3 18h18"/>',
    back:'<path d="M15 18l-6-6 6-6"/>',
    trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/>'
  };
  function ico(n, sz) {
    return '<svg width="' + (sz || 17) + '" height="' + (sz || 17) + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' + I[n] + '</svg>';
  }
  function logo(size, sw) {
    var w = sw || 1.15;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M12 1.8 22.2 12 12 22.2 1.8 12Z" stroke-width="' + w + '" opacity=".55"/>' +
      '<path d="M6.9 16.4a5.15 5.15 0 0 1 10.2 0" stroke-width="' + w + '" opacity=".45"/>' +
      '<path d="M8.85 16.4a3.2 3.2 0 0 1 6.3 0" stroke-width="' + (w * 1.15) + '" opacity=".8"/>' +
      '<circle cx="12" cy="16.5" r="1.45" fill="currentColor" stroke="none"/></svg>';
  }

  /* ═══ الخلفية المتحركة ═══
     تظهر في البوابة وفي الرئيسية فقط — لا خلف جداول التحليل، فالحركة
     خلف نصٍّ يُقرأ تشتّت. عنصرٌ واحد يُنقل لا يُعاد إنشاؤه، حتى لا

  function backdrop(on, where) {
    var bd = $('backdrop'); if (!bd) return;
    bd.classList.toggle('on', !!on);
    var v = $('backdropVid');
    if (v) {
      // إيقافه وهو مخفيّ يوفّر فكّ ترميزٍ متصلًا بلا فائدة
      if (on) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
      else v.pause();
    }
    var gate = $('gate');
    if (gate) gate.classList.toggle('over-backdrop', on && where === 'gate');
  }

  /* ═══ الجلسة ═══ */
  var ADMIN_KEY = 'nadheer:adminhash', DEFAULT_CODE = '1234';
  function codeHash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  function adminHash() {
    try { return window.localStorage.getItem(ADMIN_KEY) || codeHash(DEFAULT_CODE); }
    catch (e) { return codeHash(DEFAULT_CODE); }
  }
  var isDefaultCode = function () { return adminHash() === codeHash(DEFAULT_CODE); };
  var isAdmin = function () { return S.session && S.session.role === 'admin'; };


  /* ═══════════ الحسابات ═══════════
     أربعة حسابات: مدير + ثلاثة مستخدمين. الرموز مخزّنة كبصمة لا كنص،
     لكن ذلك تعمية لا حماية: الملف يعمل بلا خادم، فمن يفتحه بمحرر
     يستطيع تجاوز كل هذا. الغرض فصل الأدوار وتتبّع المسؤولية. */
  var ACC = (function () {
    var KEY = 'nadheer:accounts';
    var SEED = [
      { id: 'admin',  name: 'مدير النظام', role: 'admin', code: 'ADMIN1', active: true },
      { id: 'faisal', name: 'فيصل',        role: 'user',  code: '1234FA', active: true },
      { id: 'rawan',  name: 'روان',        role: 'user',  code: 'RA12',   active: true },
      { id: 'safiah', name: 'صفية',        role: 'user',  code: '1313SA', active: true }
    ];
    function load() {
      try {
        var raw = window.localStorage.getItem(KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      var seeded = SEED.map(function (a) {
        return { id: a.id, name: a.name, role: a.role, hash: codeHash(a.code), active: a.active, seedCode: a.code };
      });
      save(seeded);
      return seeded;
    }
    function save(list) {
      try { window.localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
    }
    function all() { return load(); }
    function get(id) {
      var f = load().filter(function (a) { return a.id === id; });
      return f.length ? f[0] : null;
    }
    function verify(id, code) {
      var a = get(id);
      return !!(a && a.active && codeHash(code || '') === a.hash);
    }
    function setCode(id, code) {
      var list = load();
      list.forEach(function (a) { if (a.id === id) { a.hash = codeHash(code); delete a.seedCode; } });
      save(list);
    }
    function setActive(id, on) {
      var list = load();
      list.forEach(function (a) { if (a.id === id && a.id !== 'admin') a.active = !!on; });
      save(list);
    }
    return { all: all, get: get, verify: verify, setCode: setCode, setActive: setActive };
  })();

  /* ═══════════ سجل النسخ ═══════════
     لقطة كاملة قبل كل تغيير مؤثر — هي ما يجعل «الإلغاء» ممكنًا فعلًا. */
  var VS = (function () {
    var KEY = 'nadheer:versions', MAX = 40;
    function load() { try { return JSON.parse(window.localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
    function save(l) { try { window.localStorage.setItem(KEY, JSON.stringify(l.slice(-MAX))); } catch (e) {} }
    function snap(label, actor) {
      var docs;
      try { docs = JSON.parse(window.localStorage.getItem('nadheer:docs:v1') || '[]'); } catch (e) { docs = []; }
      var v = { id: 'v' + Date.now() + Math.random().toString(36).slice(2, 6),
                at: Date.now(), label: label || '', actor: actor || '—', docs: docs };
      var l = load(); l.push(v); save(l);
      return v.id;
    }
    function restore(vid) {
      var l = load(), hit = null;
      l.forEach(function (v) { if (v.id === vid) hit = v; });
      if (!hit) return false;
      snap('قبل الاسترجاع', S.session ? S.session.name : '—');
      try { window.localStorage.setItem('nadheer:docs:v1', JSON.stringify(hit.docs)); } catch (e) { return false; }
      if (ST.reset) ST.reset();        // تصفير الكاش حتى تُقرأ النسخة المسترجَعة
      return true;
    }
    return { all: load, snap: snap, restore: restore,
             clear: function () { try { window.localStorage.removeItem(KEY); } catch (e) {} } };
  })();

  /* ═══════════ طلبات الموافقة ═══════════
     المستخدم يعمل بحرية، والإجراء يُنفَّذ فورًا — ثم يصل المدير إشعار
     يقبله أو يلغيه. الإلغاء يرجّع اللقطة السابقة، فلا يكون القبول
     مجرد كلام. الإجراءات القرائية لا تُسجَّل هنا حتى لا يغرق الصندوق. */
  var RQ = (function () {
    var KEY = 'nadheer:requests', MAX = 200;
    function load() { try { return JSON.parse(window.localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
    function save(l) { try { window.localStorage.setItem(KEY, JSON.stringify(l.slice(-MAX))); } catch (e) {} }
    function record(o) {
      if (!S.session || S.session.role === 'admin') return null;   // فعل المدير لا يحتاج موافقة نفسه
      var l = load();
      l.push({ id: 'r' + Date.now() + Math.random().toString(36).slice(2, 5),
               at: Date.now(), actor: S.session.name, actorId: S.session.id || '',
               action: o.action || 'إجراء', title: o.title || '', detail: o.detail || '',
               code: o.code || '', versionId: o.versionId || '', status: 'pending',
               decidedAt: 0, decidedBy: '' });

      return true;
    }
    function pending() { return load().filter(function (r) { return r.status === 'pending'; }).reverse(); }
    function decide(id, ok) {
      var l = load(), hit = null;
      l.forEach(function (r) { if (r.id === id) hit = r; });
      if (!hit || hit.status !== 'pending') return { ok: false };
      var reverted = false;
      if (!ok && hit.versionId) reverted = VS.restore(hit.versionId);
      hit.status = ok ? 'approved' : 'reverted';
      hit.decidedAt = Date.now();
      hit.decidedBy = S.session ? S.session.name : '—';
      save(l);
      AU.log({ kind: 'security', actor: S.session ? S.session.name : '—', code: hit.code,
               title: ok ? 'اعتماد إجراء' : 'إلغاء إجراء',
               detail: hit.actor + ' · ' + hit.title + (!ok ? (reverted ? ' · أُرجعت الحالة السابقة' : ' · بلا لقطة للإرجاع') : '') });
      return { ok: true, reverted: reverted };
    }
    return { record: record, pending: pending, all: load, decide: decide,
             clear: function () { try { window.localStorage.removeItem(KEY); } catch (e) {} } };
  })();

  /* لقطة + تسجيل طلب في نداء واحد — يُستدعى قبل الإجراء المؤثر */
  function guard(action, title, detail, code) {
    var vid = VS.snap(title, S.session ? S.session.name : '—');
    RQ.record({ action: action, title: title, detail: detail, code: code, versionId: vid });
    return vid;
  }

  var gateRole = 'user';

      : '<div style="font-size:11px;color:var(--text2);margin-top:10px">اختر حسابًا للمتابعة.</div>';

        return;
      }

    };

  }
  function fmtDur(ms) {
    var s = Math.max(0, Math.round(ms / 1000)), hh = Math.floor(s / 3600),
        mm = Math.floor((s % 3600) / 60), ss = s % 60;
    return (hh ? hh + ' س ' : '') + (hh || mm ? mm + ' د ' : '') + ss + ' ث';
  }
  function logout() {
    var dur = S.session && S.session.loginAt ? fmtDur(Date.now() - S.session.loginAt) : '';
    AU.log({ kind: 'auth', actor: S.session ? S.session.name : '—', title: 'تسجيل خروج',
             detail: dur ? 'مدة الجلسة: ' + dur : '' });
    try { window.sessionStorage.removeItem('nadheer:session'); } catch (e) {}
    S.session = null; S.analyses = {}; S.openDoc = null;
    S.draft = { doc1: '', doc2: '', ctx: '', name: '', type: 'فحص كل البنود' }; S.files = {};
    renderGate();
  }

  /* ═══════════ التحديث اليومي ═══════════
     كل مستند يُعاد تحليله بتاريخ اليوم عند كل فتح. الخطر يتحرك وحده مع
     اقتراب المواعيد، وتُسجَّل نقطة واحدة في تاريخه لكل يوم.            */
  function analyzeDoc(doc) {
    var res = E.analyze({ docText: doc.text, refText: doc.refText, context: doc.context,
                          config: S.cfg, docType: doc.docType });
    res.docId = doc.id; res.docName = doc.name; res.caseCode = doc.caseCode;

    /* لكل قاعدةٍ عنوانُها وشرحها: «منع مقابل فرض» وصفٌ صادق للقاعدة
       الأولى وحدها، وإطلاقُه على تعارض النطاق أو التعريف أو التسلسل
       يقول للمراجع غيرَ ما رصده المحرك. */
    res.conflicts = doc.refText ? CF.detect({ docText: doc.text, refText: doc.refText, config: S.cfg }).conflicts : [];
    var ci = S.cfg.conflict.impact;
    res.conflicts.forEach(function (c) {
      var risk = E.itemRisk(0.95, ci, null, S.cfg.scoring);
      var isNum = c.rule === 'حدّي';
      res.gaps.unshift({
        code: c.code, key: 'تعارض|' + c.key, type: 'تعارض مع المرجع',
        title: conflictTitle(c),
        description: conflictDesc(c) + ' تطابق الموضوع ' + c.score + '٪.',
        recommendation: 'أصدر البند المعدَّل والتعميم من صفحة «التعديلات».',
        evidence: c.docQuote, evidenceType: 'quote',
        probability: 0.95, impact: ci, decay: 1, risk: risk,
        severity: E.sevFromRisk(risk, S.cfg.scoring), conflict: c
      });
    });
    res.gaps.sort(function (a, b) { return b.risk - a.risk; });
    // الفجوات المُنجزة تخرج من الحساب — إغلاق مهمة يخفض الخطر فعلًا
    var open = res.gaps.filter(function (g) { return ST.taskOf(doc, g.code).status !== 'done'; });
    res.openGaps = open;
    res.doneCount = res.gaps.length - open.length;
    var risks = open.map(function (g) { return g.risk; })
                  .concat(res.preds.map(function (p) { return p.risk; }));
    res.effRisk = E.aggregateRisk(risks, S.cfg.scoring);
    res.stats = { critical: 0, medium: 0, low: 0 };
    open.forEach(function (g) { res.stats[g.severity]++; });
    return res;
  }
  function refreshAll() {
    S.docs = ST.list();
    S.analyses = {};
    var moved = 0;
    S.docs.forEach(function (d) {
      var res = analyzeDoc(d);
      S.analyses[d.id] = res;
      var before = ST.delta(d);
      ST.recordRisk(d.id, res.effRisk);
      if (before === null && (d.history || []).length) moved++;
    });
    S.docs = ST.list();
    return moved;
  }
  function portfolioRisk() {
    var rs = S.docs.map(function (d) { return (S.analyses[d.id] || {}).effRisk || 0; });
    return E.aggregateRisk(rs, S.cfg.scoring);
  }
  /* كل المواعيد القادمة عبر كل المستندات، مرتّبة بالأقرب */
  function allDeadlines() {
    var out = [];
    S.docs.forEach(function (d) {
      var r = S.analyses[d.id]; if (!r) return;
      r.preds.forEach(function (p) { out.push({ doc: d, p: p }); });
    });
    return out.sort(function (a, b) { return a.p.daysRemaining - b.p.daysRemaining; });
  }
  function allOverdue() {
    var out = [];
    S.docs.forEach(function (d) {
      var r = S.analyses[d.id]; if (!r) return;
      r.openGaps.filter(function (g) { return g.type === 'موعد متجاوز'; })
        .forEach(function (g) { out.push({ doc: d, g: g }); });
    });
    return out;
  }
  /* أرقام الداشبورد التنفيذي — تُجمَع من كل المستندات */
  function exec() {
    var openGaps = 0, doneGaps = 0, totalGaps = 0, conflicts = 0;
    var accruing = [], upcoming = [], uncounted = [];
    S.docs.forEach(function (d) {
      var r = S.analyses[d.id]; if (!r) return;
      totalGaps += r.gaps.length; openGaps += r.openGaps.length; doneGaps += r.doneCount;
      conflicts += (r.conflicts || []).length;
      r.obligations.forEach(function (o) {
        if (o.exposure === null || o.exposure === undefined) {
          if (o.exposureNote) uncounted.push({ doc: d, o: o });   // سقف نسبي بلا قيمة عقد
          return;
        }
        (o.exposureAccruing ? accruing : upcoming).push({ doc: d, o: o });
      });
    });
    accruing.sort(function (a, b) { return b.o.exposure - a.o.exposure; });
    upcoming.sort(function (a, b) { return a.o.daysRemaining - b.o.daysRemaining; });
    var sum = function (l) { return l.reduce(function (a, x) { return a + x.o.exposure; }, 0); };
    return {
      openGaps: openGaps, doneGaps: doneGaps, totalGaps: totalGaps, conflicts: conflicts,
      pctDone: totalGaps ? Math.round(doneGaps / totalGaps * 100) : 0,
      accruing: accruing, upcoming: upcoming, uncounted: uncounted,
      accruingSum: sum(accruing), upcomingSum: sum(upcoming),
      nextFine: upcoming.length ? upcoming[0] : null
    };
  }
  var money = function (n) {
    return Math.round(n).toLocaleString('en-US');
  };

  function allTasks() {
    var out = [];
    S.docs.forEach(function (d) {
      var r = S.analyses[d.id]; if (!r) return;
      r.gaps.forEach(function (g) {
        var t = ST.taskOf(d, g.code);
        out.push({ doc: d, gap: g, task: t });
      });
    });
    return out.sort(function (a, b) {
      var rank = { doing: 0, todo: 1, done: 2 };
      return (rank[a.task.status] - rank[b.task.status]) || (b.gap.risk - a.gap.risk);
    });
  }

  /* ═══ التنقّل ═══ */
  var NAV = [
    { r: 'home',  t: 'الرئيسية' },
    { r: 'docs',  t: 'المستندات' },
    { r: 'plan',  t: 'خطة المعالجة' },
    { sep: 'الإدارة', admin: true },
    { r: 'admin', t: 'إعدادات المحرك', admin: true },
    { r: 'audit', t: 'سجل التتبّع', admin: true },
    { r: 'approvals', t: 'الموافقات والنسخ', admin: true },
    { r: 'security', t: 'الأمان والدخول', admin: true }
  ];
  var routes = { home: renderHome, docs: renderDocs, doc: renderDoc, upload: renderUpload,
                 plan: renderPlan, admin: renderAdmin, audit: renderAudit, security: renderSecurity,
                 approvals: renderApprovals };
  function renderNav() {

    });

  function go(route, arg) {
    if (!S.session) { renderGate(); return; }
    if (['admin', 'audit', 'security', 'approvals'].indexOf(route) > -1 && !isAdmin()) route = 'home';
    if (route === 'doc' && arg) { S.openDoc = arg; S.docTab = 'sum'; }

    $('navOverlay').classList.remove('open');
    Array.prototype.forEach.call($('navPanel').querySelectorAll('.navlink[data-r]'), function (l) {
      l.classList.toggle('active', l.dataset.r === route);
