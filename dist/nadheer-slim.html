}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--text);min-height:100vh;font-weight:400;
  background-color:var(--bg);
  background-image:
    var(--mesh),
    radial-gradient(1200px 700px at 78% -12%, rgba(88,72,190,.30), transparent 60%),
    radial-gradient(900px 620px at 6% 2%, rgba(54,40,120,.34), transparent 58%),
    radial-gradient(700px 500px at 50% 108%, rgba(216,190,134,.055), transparent 62%),
    linear-gradient(178deg,#0C0F26 0%,#070915 46%,#04050D 100%);
  background-repeat:no-repeat;
  background-position:center -40px,right top,left top,center bottom,center;
  background-size:1600px 1000px,auto,auto,auto,auto;
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-thumb{background:rgba(190,200,240,.14);border-radius:4px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── مفردات مشتركة ── */
.eyebrow{font-size:9.5px;letter-spacing:.16em;color:var(--gold);font-weight:600;margin-bottom:9px}
.hair{height:1px;border:0;margin:14px 0;
  background:linear-gradient(90deg,transparent,rgba(216,190,134,.34),transparent)}
.num{font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}

.brandmark{width:34px;height:34px;border-radius:2px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:var(--gold2);background:linear-gradient(150deg,rgba(216,190,134,.16),transparent 70%)}
nav.topnav{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;
  background:rgba(7,9,21,.78);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:blur(16px)}
.nav-left{display:flex;align-items:center;gap:11px}
.burger{background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 9px;cursor:pointer;color:var(--text2);
  display:flex;align-items:center}
.burger:hover{border-color:var(--line2)}
.avatar{width:31px;height:31px;border-radius:50%;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px;color:var(--gold2);
  background:rgba(216,190,134,.07)}
.userinfo{display:flex;flex-direction:column;gap:1px}
.userinfo .un{font-size:12.5px;font-weight:500}
.userinfo .ur{font-size:9px;color:var(--text3);letter-spacing:.06em}
.nav-brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0}
.nav-brand .nm{font-size:15px;font-weight:500;text-align:left;letter-spacing:.02em}
.nav-brand .sub{font-size:8.5px;color:var(--text3);letter-spacing:.09em;text-align:left}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:var(--text2);letter-spacing:.06em;
  border:1px solid var(--line);border-radius:2px;padding:4px 9px;margin-left:10px}
.offline i{width:4px;height:4px;border-radius:50%;background:var(--success);display:block}

.navoverlay{position:fixed;inset:0;z-index:200;display:none}
.navoverlay.open{display:flex}
.navoverlay .scrim{flex:1;background:rgba(4,5,13,.72);backdrop-filter:blur(3px)}
.navpanel{width:252px;background:linear-gradient(200deg,#0F1230,#070915);border-left:1px solid var(--line);
  padding:24px 18px;display:flex;flex-direction:column;gap:2px}
.navpanel .hdr{font-size:9.5px;letter-spacing:.16em;color:var(--gold);font-weight:600;margin-bottom:14px}
.navlink{padding:11px 12px;border:none;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;
  text-align:right;border-right:1px solid transparent;transition:.15s}
.navlink:hover{color:var(--text)}
.navlink.active{color:var(--gold2);border-right-color:var(--gold);background:linear-gradient(270deg,rgba(216,190,134,.09),transparent)}
.navsep{font-size:9px;letter-spacing:.14em;color:var(--text3);margin:16px 0 8px;padding-right:12px}

.page{padding:26px 18px 56px;max-width:920px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px;margin-bottom:14px}
.sectitle{font-size:9.5px;letter-spacing:.16em;color:var(--gold);font-weight:600;margin-bottom:16px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
h2.pagetitle{font-size:25px;font-weight:300;margin:0 0 6px;letter-spacing:-.01em}
p.pagesub{color:var(--text2);font-size:12.5px;margin:0 0 22px;line-height:1.85;font-weight:300;max-width:64ch}

/* ── الإدخال ── */
.drop{border:1px dashed var(--line2);border-radius:3px;padding:22px;text-align:center;cursor:pointer;
  background:transparent;transition:.2s;width:100%;display:block}
.drop:hover,.drop.drag{border-color:var(--gold);background:var(--goldFaint)}
.drop .ic{margin-bottom:9px;display:flex;justify-content:center;color:var(--gold)}
.drop .mt{font-size:12.5px;font-weight:400}
.drop .ht{font-size:10px;color:var(--text3);margin-top:5px;letter-spacing:.05em}
.doclabel{font-size:9.5px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-bottom:10px}
.fileinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:2px;padding:10px 12px;margin-top:8px;font-size:11.5px}
.fileinfo button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px}
textarea,input[type=text],input[type=password],input[type=number],select{
  width:100%;background:rgba(4,5,13,.55);color:var(--text);border:1px solid var(--line);border-radius:2px;
  padding:11px;font-family:inherit;font-size:12.5px;font-weight:300}
textarea{min-height:64px;margin-top:8px;resize:vertical;line-height:1.8}
textarea:focus,input:focus,select:focus{border-color:var(--line2);outline:none}
.field-label{font-size:10px;color:var(--text3);margin:14px 0 7px;display:block;letter-spacing:.09em}

.btn{background:var(--gold);color:#0B0A14;border:none;padding:13px 22px;border-radius:2px;font-size:13px;
  font-weight:600;cursor:pointer;width:100%;letter-spacing:.02em;transition:.15s}
.btn:hover{background:var(--gold2)}
.btn:disabled{background:rgba(255,255,255,.06);color:var(--text3);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text2);font-weight:400}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2);background:transparent}
.btn.sm{padding:8px 14px;font-size:11.5px;width:auto}
.btn.danger{background:transparent;border:1px solid rgba(255,107,122,.4);color:var(--danger);font-weight:400}
.row-btns{display:flex;gap:10px;margin-top:16px}

.errbox{background:rgba(255,107,122,.07);border:1px solid rgba(255,107,122,.32);color:#FFAEB6;
  padding:11px 14px;border-radius:2px;font-size:12.5px;margin-top:14px;line-height:1.8;font-weight:300}
.okbox{background:var(--goldFaint);border:1px solid rgba(216,190,134,.3);color:var(--gold2);
  padding:11px 14px;border-radius:2px;font-size:12.5px;margin-top:14px;line-height:1.8;font-weight:300}

.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:2px;font-size:9.5px;
  font-weight:600;white-space:nowrap;letter-spacing:.06em}
.badge.high{background:rgba(255,107,122,.11);color:#FF98A3;border:1px solid rgba(255,107,122,.26)}
.badge.med{background:rgba(242,153,74,.11);color:#F7B274;border:1px solid rgba(242,153,74,.26)}
.badge.low{background:rgba(95,211,168,.11);color:#7FE0BC;border:1px solid rgba(95,211,168,.26)}
.badge.info{background:var(--goldFaint);color:var(--gold2);border:1px solid rgba(216,190,134,.28)}
.badge.mute{background:rgba(255,255,255,.03);color:var(--text3);border:1px solid var(--line)}
.code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:10px;color:var(--gold);
  letter-spacing:.06em;background:var(--goldFaint);border:1px solid rgba(216,190,134,.22);
  border-radius:2px;padding:2px 7px;white-space:nowrap;direction:ltr;display:inline-block}

/* ── الدخول ── */
#gate{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:22px;
  background:var(--bg);background-image:var(--mesh),radial-gradient(900px 600px at 70% 0%,rgba(88,72,190,.3),transparent 60%),
    linear-gradient(180deg,#0C0F26,#04050D);
  background-repeat:no-repeat;background-position:center -60px,right top,center;background-size:1600px 1000px,auto,auto}
#gate.open{display:flex}
.gate-card{width:100%;max-width:372px;text-align:center}
.gate-mark{width:74px;height:74px;border-radius:3px;border:1px solid var(--line2);margin:0 auto 24px;
  display:flex;align-items:center;justify-content:center;color:var(--gold2);
  background:linear-gradient(150deg,rgba(216,190,134,.18),transparent 70%);
  box-shadow:0 0 44px rgba(216,190,134,.10)}
.gate-card h1{font-size:27px;font-weight:200;margin:0 0 6px;letter-spacing:.01em}
.gate-card .tag{font-size:10px;color:var(--text3);letter-spacing:.18em;margin-bottom:26px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role{padding:15px 12px;border:1px solid var(--line);border-radius:3px;background:transparent;cursor:pointer;text-align:center;transition:.16s}
.role:hover{border-color:var(--line2)}
.role.sel{border-color:var(--gold);background:var(--goldFaint)}
.role .rn{font-size:13px;font-weight:500;margin-top:8px}
.role .rd{font-size:9.5px;color:var(--text3);margin-top:4px;line-height:1.6}
.role svg{color:var(--gold)}
.gate-note{font-size:10px;color:var(--text3);line-height:1.9;margin-top:20px;text-align:right;
  border:1px solid var(--line);border-radius:2px;padding:11px 13px}

/* ── لوحة النتائج ── */
.risk-hero{border:1px solid var(--line);border-radius:3px;padding:26px 22px;margin-bottom:16px;
  background:linear-gradient(140deg,rgba(216,190,134,.07),rgba(88,72,190,.07) 55%,transparent)}
.risk-hero .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.risk-title{font-size:21px;font-weight:200;line-height:1.5;letter-spacing:-.01em}
.risk-title b{font-weight:400;color:var(--gold2)}
.risk-num{font-size:62px}
.risk-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.delta{font-size:10.5px;font-weight:600;margin-top:7px;letter-spacing:.04em}

.memobar{border:1px solid var(--line);border-right:2px solid var(--gold);border-radius:2px;padding:15px 17px;margin-bottom:16px;
  background:linear-gradient(270deg,rgba(216,190,134,.05),transparent)}
.memobar ul{margin:0;padding-right:15px}
.memobar li{font-size:11.5px;color:var(--text2);line-height:2;font-weight:300}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-bottom:16px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--bg);padding:20px 16px;cursor:pointer;text-align:right;border:none;transition:.16s}
.kpi:hover{background:var(--card2)}
.kpi .v{font-size:31px;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--text2);margin-top:6px;letter-spacing:.04em}
.kpi .s{font-size:9.5px;color:var(--text3);margin-top:3px;line-height:1.6}

.barrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.barrow .lbl{width:122px;font-size:11.5px;color:var(--text2);flex-shrink:0;font-weight:300}
.barrow .track{flex:1;background:rgba(255,255,255,.05);height:3px;overflow:hidden}
.barrow .fill{height:100%}
.barrow .val{width:28px;font-size:12px;font-weight:400;text-align:left;font-variant-numeric:tabular-nums}

.pred-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.pred-row:last-child{border-bottom:none}
.pred-tag{flex-shrink:0;font-size:10px;font-weight:600;border-radius:2px;padding:4px 9px;white-space:nowrap;height:fit-content;letter-spacing:.04em}
.pred-row .t{font-weight:400;font-size:12.5px;margin-bottom:3px}
.pred-row .b{font-size:11.5px;color:var(--text2);line-height:1.75;font-weight:300}

.gap-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px;margin-bottom:12px;border-right:2px solid var(--text3)}
.gap-card.critical{border-right-color:var(--danger)}
.gap-card.medium{border-right-color:var(--warning)}
.gap-card.low{border-right-color:var(--success)}
.gap-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gap-title{font-size:14.5px;font-weight:400;line-height:1.55}
.gap-meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.gap-type{font-size:10px;color:var(--text3);letter-spacing:.06em}
.gap-type-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);letter-spacing:.06em;padding:4px 8px;border:1px solid rgba(136,126,215,.2);border-radius:2px;cursor:help;background:rgba(136,126,215,.03);transition:.15s}
.gap-type-tag:hover{border-color:var(--gold);color:var(--gold);background:rgba(216,190,134,.08)}
.gap-type-tag svg{opacity:.6}
.gap-desc{font-size:12px;line-height:1.9;color:var(--text2);margin-top:11px;font-weight:300}
.gap-rec{margin-top:11px;padding:13px 13px;border-right:1px solid var(--gold);background:var(--goldFaint);
  font-size:11.5px;color:var(--gold2);line-height:1.8;font-weight:300;display:flex;gap:10px;align-items:flex-start}
.gap-rec svg{flex-shrink:0;margin-top:2px;opacity:.7}
.gap-rec > div{flex:1}
.rec-label{font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--gold);margin-bottom:4px}

.evidence{margin-top:11px;border:1px solid var(--line);border-right:2px solid var(--line2);background:rgba(4,5,13,.42);
  padding:11px 13px;font-size:11.5px;color:var(--text2);line-height:1.9;cursor:pointer;width:100%;text-align:right;
  display:block;font-weight:300;border-radius:0 2px 2px 0}
.evidence:hover{border-right-color:var(--gold);background:rgba(4,5,13,.62)}
.evidence .lb{display:block;font-size:9px;color:var(--text3);margin-bottom:5px;letter-spacing:.1em}
.absence{margin-top:11px;border:1px dashed var(--line2);background:rgba(242,153,74,.045);
  padding:11px 13px;font-size:11.5px;color:var(--text2);line-height:1.9;font-weight:300;border-radius:2px}
.absence .lb{display:block;font-size:9px;color:var(--text3);margin-bottom:5px;letter-spacing:.1em}

.mathbox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid var(--line);
  padding-top:12px;margin-top:12px;font-size:10.5px;color:var(--text3);letter-spacing:.03em}
.mathbox b{color:var(--text2);font-weight:500;font-variant-numeric:tabular-nums}
.mathbox .op{color:var(--text3);opacity:.5}
.mathbox .out{margin-right:auto;font-weight:300;font-size:19px;font-variant-numeric:tabular-nums}

.pred-card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px;margin-bottom:12px;display:flex;gap:18px;align-items:flex-start}
.pred-days{flex-shrink:0;text-align:center;min-width:62px}
.pred-days .n{font-size:30px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pred-days .u{font-size:9px;color:var(--text3);letter-spacing:.1em;margin-top:2px}
.pred-body{flex:1;min-width:0}
.pred-title2{font-size:13.5px;font-weight:400;margin-bottom:5px;line-height:1.5}
.pred-trigger{font-size:10.5px;color:var(--text3);margin-bottom:8px;line-height:1.7}
.pred-cons{font-size:11.5px;color:var(--text2);line-height:1.85;border-right:1px solid var(--warning);
  padding:9px 12px;margin-top:7px;background:rgba(242,153,74,.05);font-weight:300}
.pred-cons b{color:var(--warning);font-weight:500}
.pred-rec{margin-top:10px;padding:10px 12px;border-right:1px solid var(--gold);background:var(--goldFaint);
  font-size:11.5px;color:var(--gold2);line-height:1.8;font-weight:300}

.timeline{position:relative;border:1px solid var(--line);height:64px;margin-bottom:18px;overflow:hidden;
  background:linear-gradient(90deg,rgba(216,190,134,.05),transparent 60%)}
.tl-mark{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-mark span{position:absolute;top:6px;right:5px;font-size:8.5px;color:var(--text3);white-space:nowrap;letter-spacing:.06em}
.tl-dot{position:absolute;bottom:14px;width:7px;height:7px;border-radius:50%;transform:translateX(50%)}

.gap-legend{background:var(--goldFaint);border:1px solid rgba(216,190,134,.2);border-radius:3px;padding:14px 16px;margin-bottom:18px}
.legend-title{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--gold);margin-bottom:10px}
.legend-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.legend-item{display:flex;gap:10px;align-items:flex-start;font-size:11px;color:var(--text2)}
.legend-tag{display:inline-flex;align-items:center;gap:4px;font-weight:500;color:var(--gold2);flex-shrink:0}
.legend-tag svg{opacity:.6}
.legend-desc{font-size:10px;color:var(--text3);font-weight:300}

.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{background:transparent;border:1px solid var(--line);color:var(--text2);padding:7px 14px;border-radius:2px;
  font-size:11px;cursor:pointer;letter-spacing:.03em;transition:.15s}
.filter-btn:hover{border-color:var(--line2)}
.filter-btn.active{background:var(--goldFaint);color:var(--gold2);border-color:var(--gold)}
.empty{text-align:center;color:var(--text3);padding:34px 20px;font-size:12px;line-height:1.9;font-weight:300}

.clause-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.clause{display:flex;align-items:center;gap:10px;padding:12px 13px;font-size:11.5px;background:var(--bg);font-weight:300}
.clause.miss{background:rgba(242,153,74,.05)}
.clause .mk{width:15px;height:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
.clause.ok .mk{color:var(--success)}
.clause.miss .mk{color:var(--warning)}

.remed-item{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px;margin-bottom:12px}
.remed-item .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}
.remed-item .ttl{font-size:14px;font-weight:400;line-height:1.55}
.remed-action{border-right:1px solid var(--line2);padding:11px 13px;font-size:11.5px;line-height:1.9;
  margin-bottom:13px;color:var(--text2);font-weight:300}
.remed-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.remed-meta>div{background:var(--bg);padding:11px 13px}
.remed-meta .l{font-size:9px;color:var(--text3);margin-bottom:4px;letter-spacing:.1em}
.remed-meta .v{font-size:12px;font-weight:400}

.report-head{border:1px solid var(--line2);border-radius:3px;padding:24px;margin-bottom:16px;
  background:linear-gradient(140deg,rgba(216,190,134,.10),rgba(88,72,190,.08) 60%,transparent)}
.report-head h3{font-size:22px;font-weight:200;margin:0 0 6px;letter-spacing:-.01em}
.report-head p{color:var(--text2);font-size:11.5px;margin:0;font-weight:300}
.report-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:20px;background:var(--line);border:1px solid var(--line)}
.report-stats>div{background:rgba(7,9,21,.6);padding:15px 8px;text-align:center}
.report-stats .v{font-size:24px;font-weight:200;font-variant-numeric:tabular-nums}
.report-stats .l{font-size:9px;color:var(--text3);margin-top:5px;letter-spacing:.08em}
.quote{margin:20px 0 4px;padding:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--text2);text-align:center;line-height:2.1;font-weight:200;font-style:italic}

.rubric{font-size:11.5px;color:var(--text2);line-height:2;font-weight:300}
.rubric b{color:var(--text);font-weight:500}
.rubric table{width:100%;border-collapse:collapse;margin-top:12px}
.rubric td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:10.5px;vertical-align:top}
.rubric td:last-child{text-align:left;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:14px}

/* ── الإدارة والتتبع ── */
.adm-row{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.adm-row:last-child{border-bottom:none}
.adm-row input[type=text]{flex:1}
.adm-row input[type=number]{width:82px;text-align:center;font-variant-numeric:tabular-nums}
.adm-row .x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:0 5px;flex-shrink:0}
.adm-row .x:hover{color:var(--danger)}
.adm-row .nm{flex:1;font-size:12px;font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:2px;
  padding:4px 9px;font-size:10.5px;color:var(--text2);font-weight:300}
.chip button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0;line-height:1}
.chip button:hover{color:var(--danger)}
.addrow{display:flex;gap:8px;margin-top:10px}
.log{border:1px solid var(--line);border-radius:2px;margin-bottom:9px;padding:13px 15px;background:var(--card)}
.log .lh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.log .lt{font-size:12px;font-weight:400}
.log .ld{font-size:9.5px;color:var(--text3);letter-spacing:.05em;font-variant-numeric:tabular-nums;direction:ltr}
.log .lb{font-size:11px;color:var(--text2);line-height:1.85;margin-top:7px;font-weight:300}
.log .diff{font-size:10.5px;color:var(--text3);margin-top:6px;line-height:1.8;direction:ltr;text-align:left;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.trace{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:16px}
.trace>div{background:var(--bg);padding:14px 12px}
.trace .v{font-size:20px;font-weight:200;font-variant-numeric:tabular-nums}
.trace .l{font-size:9px;color:var(--text3);margin-top:4px;letter-spacing:.08em}

#proc{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;align-items:center;justify-content:center;padding:22px;
  background-image:var(--mesh),linear-gradient(180deg,#0C0F26,#04050D);
  background-repeat:no-repeat;background-position:center -60px,center;background-size:1600px 1000px,auto}
#proc.active{display:flex}
.proc-wrap{max-width:390px;width:100%;text-align:center}
.proc-orb{width:68px;height:68px;border-radius:3px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:var(--gold2);
  background:linear-gradient(150deg,rgba(216,190,134,.16),transparent 70%)}
.proc-steps{text-align:right;margin-top:24px}
.proc-step{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:11.5px;color:var(--text3);
  border-bottom:1px solid var(--line);font-weight:300}
.proc-step.done{color:var(--text2)}
.proc-step .dot{width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  font-size:9px;flex-shrink:0;color:var(--text3);border:1px solid var(--line);border-radius:50%}
.proc-step.done .dot{color:var(--gold);border-color:var(--gold)}
.proc-step .out{margin-right:auto;font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.04em}

#viewer{position:fixed;inset:0;z-index:300;display:none}
#viewer.open{display:flex}
#viewer .scrim{flex:1;background:rgba(4,5,13,.74);backdrop-filter:blur(3px)}
.viewpanel{width:min(580px,93vw);background:linear-gradient(200deg,#0F1230,#070915);border-left:1px solid var(--line2);
  display:flex;flex-direction:column}
.viewpanel .vh{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid var(--line)}
.viewpanel .vh .t{font-size:9.5px;letter-spacing:.16em;color:var(--gold);font-weight:600}
.viewpanel .vh button{background:none;border:none;color:var(--text3);font-size:17px;cursor:pointer}
.viewbody{flex:1;overflow:auto;padding:20px;font-size:12.5px;line-height:2.25;color:var(--text2);white-space:pre-wrap;font-weight:300}
.viewbody mark{background:rgba(216,190,134,.24);color:var(--gold2);border-bottom:1px solid var(--gold);padding:1px 2px}

@media(max-width:560px){
  .clause-grid,.remed-meta{grid-template-columns:1fr}
  .report-stats{grid-template-columns:repeat(2,1fr)}
  .risk-num{font-size:52px}
  h2.pagetitle{font-size:22px}
}

/* ── صف قابل للنقر (الرئيسية) ── */
.linkrow{display:flex;gap:13px;align-items:center;width:100%;background:transparent;border:none;
  border-bottom:1px solid var(--line);padding:13px 2px;text-align:right;cursor:pointer;transition:.15s}
.linkrow:last-child{border-bottom:none}
.linkrow:hover{background:rgba(255,255,255,.022)}
.lr-tag{flex-shrink:0;font-size:10px;font-weight:600;border:1px solid;border-radius:2px;padding:4px 9px;
  white-space:nowrap;letter-spacing:.04em;min-width:62px;text-align:center}
.lr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lr-body b{font-weight:400;font-size:12.5px;line-height:1.6;color:var(--text)}
.lr-body i{font-style:normal;font-size:10px;color:var(--text3);letter-spacing:.03em}

.backlink{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:0 0 14px;
  display:flex;align-items:center;gap:6px;letter-spacing:.04em}
.backlink:hover{color:var(--gold)}

/* ── بطاقة مستند ── */
.doc-card{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:3px;
  margin-bottom:10px;background:var(--card);overflow:hidden}
.doc-card:hover{border-color:var(--line2)}
.doc-main{flex:1;min-width:0;background:transparent;border:none;padding:16px 18px;text-align:right;cursor:pointer}
.doc-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.doc-name{font-size:14.5px;font-weight:400;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-risk{font-size:26px;flex-shrink:0}
.doc-meta{font-size:10.5px;color:var(--text3);margin-top:7px;line-height:1.7}
.doc-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.doc-spark{margin-right:auto;display:flex;align-items:center;opacity:.85}
.doc-del{flex-shrink:0;background:transparent;border:none;border-right:1px solid var(--line);
  color:var(--text3);padding:0 15px;cursor:pointer}
.doc-del:hover{color:var(--danger);background:rgba(255,107,122,.06)}

/* ── مهمة معالجة ── */
.task{border:1px solid var(--line);border-right:2px solid var(--line2);border-radius:3px;
  padding:17px;margin-bottom:11px;background:var(--card)}
.task.done{opacity:.55;border-right-color:var(--success)}
.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.task-title{font-size:13.5px;font-weight:400;line-height:1.55}
.task-doc{background:none;border:none;color:var(--gold);font-size:10px;cursor:pointer;padding:0;
  letter-spacing:.03em;text-decoration:underline;text-underline-offset:3px}
.task-action{font-size:11.5px;color:var(--text2);line-height:1.9;margin-top:11px;font-weight:300}
.task-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--text3);letter-spacing:.03em}

.statusbar{display:flex;gap:1px;margin-top:13px;background:var(--line);border:1px solid var(--line)}
.statusbar .st{flex:1;background:var(--bg);border:none;padding:9px 6px;font-size:10.5px;color:var(--text3);
  cursor:pointer;letter-spacing:.03em;transition:.14s}
.statusbar .st:hover{color:var(--text2)}
.statusbar .st.on{color:#0B0A14;font-weight:600}
.statusbar .st.on.todo{background:var(--text3)}
.statusbar .st.on.doing{background:var(--warning)}
.statusbar .st.on.done{background:var(--success)}
.gap-card.done{opacity:.55;border-right-color:var(--success)}

/* ── تفاصيل الحساب مطوية افتراضيًا ── */
details.why{margin-top:11px}
details.why summary{cursor:pointer;font-size:10px;color:var(--text3);letter-spacing:.06em;list-style:none;padding:4px 0}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:'▸ ';color:var(--gold)}
details.why[open] summary::before{content:'▾ '}
details.why .mathbox{margin-top:4px;border-top:none;padding-top:8px}

.subcard{border:1px solid var(--line);padding:14px;margin-bottom:10px}
.grouplbl{font-size:10px;color:var(--gold);letter-spacing:.12em;margin:18px 0 8px}

/* ── الداشبورد التنفيذي ── */
.exec{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:14px}
.exec-cell{background:var(--bg);padding:16px 15px;text-align:right}
.exec-cell .v{font-size:30px;letter-spacing:-.02em}
.exec-cell .l{font-size:10.5px;color:var(--text2);margin-top:7px;letter-spacing:.03em}
.exec-cell .s{font-size:9.5px;color:var(--text3);margin-top:4px}
.progress{height:5px;background:rgba(255,255,255,.05);overflow:hidden}
.progress .pf{height:100%;background:var(--c-good);transform-origin:right center;
  animation:grow .8s cubic-bezier(.22,.9,.3,1) backwards}
.progress-lbl{display:flex;justify-content:space-between;margin-top:9px;font-size:10.5px;color:var(--text3);letter-spacing:.03em}
.note{font-size:9.5px;color:var(--text3);line-height:1.85;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ── صفحة التعديلات ── */
.warnbox{border:1px solid rgba(242,153,74,.34);background:rgba(242,153,74,.06);color:#F7B274;
  padding:13px 15px;border-radius:2px;font-size:11.5px;line-height:1.9;margin-bottom:16px;font-weight:300}
.fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fixgrid .field-label{margin-top:0}
.fixcard{border:1px solid var(--line);border-right:2px solid var(--danger);border-radius:3px;
  padding:18px;margin-bottom:12px;background:var(--card)}
.fixcard.off{opacity:.42;border-right-color:var(--text3)}
.fixside{margin-top:14px}
.fs-lbl{font-size:9px;letter-spacing:.12em;color:var(--text3);margin-bottom:6px}
.fs-lbl.bad{color:var(--danger)}
.fs-lbl.good{color:var(--success)}
.fixprop{background:rgba(95,211,168,.05);border-color:rgba(95,211,168,.28);line-height:1.95}
.tick{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text3);white-space:nowrap;cursor:pointer}
.tick input{accent-color:var(--gold);width:14px;height:14px}
@media(max-width:520px){.fixgrid{grid-template-columns:1fr}}

/* مقارنة القيمتين في التعارض الحدّي */
.qcmp{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.qcmp .q{font-size:14px;font-weight:400;padding:7px 14px;border:1px solid;border-radius:2px;font-variant-numeric:tabular-nums}
.qcmp .q.bad{color:var(--danger);border-color:rgba(255,107,122,.4);background:rgba(255,107,122,.06)}
.qcmp .q.good{color:var(--success);border-color:rgba(95,211,168,.4);background:rgba(95,211,168,.06)}
.qcmp .qar{color:var(--text3);font-size:15px}
.vtag{font-size:9px;color:var(--gold);border:1px solid rgba(216,190,134,.32);border-radius:2px;
  padding:2px 7px;letter-spacing:.05em;vertical-align:middle;font-weight:400}

/* ═══════════ لوحة القيادة — الرسوم ═══════════
   ألوان الرسوم درجاتٌ خاصة بها، مشتقّة من أطياف الحالة نفسها لكن
   مُعاد ضبطها لتمرّ فحص الفصل اللوني على سطحٍ داكن: الزوج الأحمر/الكهرماني
   في ألوان الواجهة كان ΔE ١٣٫١ (دون حدّ ١٥) فيصعب تمييزه حتى بالبصر
   التام؛ هذه الدرجات ترفعه إلى ١٩٫٦، وفصلَ عمى الألوان إلى ١١٫٤.
   نطاق الإضاءة يخرج قليلًا عن حدّ الأداة لأنه معايَر لسطحٍ أفتح كثيرًا
   من سطحنا (L 0.20 مقابل 0.11) — والتباين يمرّ ≥3:1 لكل درجة. */
:root{
  --c-crit:#E8476B; --c-warn:#D9942B; --c-good:#2FBF91;
  /* سُلّم تدرّجي أحادي الطيف للمقادير — على سطح داكن يكون الأكبر أفتح */
  --seq-6:#F3E4BC; --seq-5:#E2CD9B; --seq-4:#CDB073;
  --seq-3:#B4914E; --seq-2:#93712F; --seq-1:#6E521C;
  --chart-grid:rgba(190,200,240,.09);
  --chart-ink:#9AA2C6;
}

.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:14px}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.chart-title{font-size:9.5px;letter-spacing:.16em;color:var(--gold);font-weight:600}
.chart-sub{font-size:10px;color:var(--text3);font-weight:300}
.chart-note{font-size:9.5px;color:var(--text3);line-height:1.75;margin-top:11px;font-weight:300}

/* ── المؤشر القوسي ── */
.gauge{position:relative;display:flex;justify-content:center;padding:4px 0 2px}
.gauge svg{overflow:visible}
.gauge .arcv{stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--off);
  animation:sweep 1.05s cubic-bezier(.22,.9,.3,1)}
@keyframes sweep{from{stroke-dashoffset:var(--len)}}
.gauge .tick{stroke:var(--chart-grid);stroke-width:1}
.gauge-mid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding-top:30px;pointer-events:none}
.gauge-num{font-size:36px;font-weight:200;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.gauge-word{font-size:9.5px;letter-spacing:.14em;margin-top:5px;font-weight:500}
.gauge-scale{display:flex;justify-content:space-between;font-size:9px;color:var(--text3);
  margin-top:-6px;padding:0 6px;letter-spacing:.06em}

/* ── الخط الزمني ── */
.trend{position:relative}
.trend svg{display:block;width:100%;height:auto}
.trend .tline{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1.15s ease-out}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.trend .tarea{animation:fadein .7s .5s ease-out backwards}
@keyframes fadein{from{opacity:0}}
.trend .tdot{fill:var(--gold);stroke:var(--bg);stroke-width:2;animation:fadein .4s .9s ease-out backwards}
.trend .hit{fill:transparent;cursor:crosshair}
.trend .cross{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 3;opacity:0}
.trend .cdot{fill:var(--gold2);stroke:var(--bg);stroke-width:2;opacity:0}
.trend.on .cross,.trend.on .cdot{opacity:1}
.tip{position:absolute;pointer-events:none;background:rgba(4,5,13,.96);border:1px solid var(--line2);
  border-radius:3px;padding:7px 10px;font-size:10.5px;color:var(--text);white-space:nowrap;
  opacity:0;transition:opacity .12s;z-index:6;line-height:1.6}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums;font-weight:500}
.tip i{display:block;font-style:normal;color:var(--text3);font-size:9.5px;margin-top:2px}

/* ── الأشرطة الأفقية ── */
.hbars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.hbar{display:grid;grid-template-columns:92px 1fr 26px;align-items:center;gap:10px;
  background:none;border:none;padding:0;cursor:pointer;text-align:right;font-family:inherit}
.hbar .hl{font-size:10.5px;color:var(--text2);font-weight:300;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hbar .ht{background:rgba(255,255,255,.045);height:15px;border-radius:2px;overflow:hidden;position:relative}
.hbar .ht{display:block}
.hbar .hf{display:block;height:100%;border-radius:0 2px 2px 0;transform-origin:right center;
  animation:grow .8s cubic-bezier(.22,.9,.3,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.hbar .hv{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;text-align:left;font-weight:400}
.hbar:hover .hl{color:var(--gold2)}
.hbar:hover .ht{background:rgba(255,255,255,.08)}
.hbar:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* ── شريط الخطورة المجزّأ ── */
.sevbar{display:flex;gap:2px;height:19px;margin-top:14px}
.sevseg{border-radius:2px;position:relative;transform-origin:right center;
  animation:grow .75s cubic-bezier(.22,.9,.3,1) backwards;cursor:pointer;border:none;padding:0}
.sevseg:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.sevkeys{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px}
.sevkey{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text2);font-weight:300}
.sevkey i{width:9px;height:9px;border-radius:2px;display:block;flex-shrink:0}
.sevkey b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}

/* الجدول البديل — الهوية لا تكون باللون وحده أبدًا */
.charttable{width:100%;border-collapse:collapse;margin-top:10px;font-size:10.5px}
.charttable th{text-align:right;color:var(--text3);font-weight:500;font-size:9px;
  letter-spacing:.08em;padding:6px 4px;border-bottom:1px solid var(--line)}
.charttable td{padding:6px 4px;border-bottom:1px solid var(--line);color:var(--text2);font-weight:300}
.charttable td:last-child{text-align:left;font-variant-numeric:tabular-nums;color:var(--text)}
details.tabletoggle summary{font-size:9.5px;color:var(--text3);cursor:pointer;margin-top:12px;
  letter-spacing:.06em;list-style:none}
details.tabletoggle summary::-webkit-details-marker{display:none}
details.tabletoggle summary:before{content:'⌄ ';color:var(--gold)}
details.tabletoggle[open] summary:before{content:'⌃ '}

/* تنبيه معايرة العتبات — درجةٌ مبنية على أرقامٍ افتراضية تبدو موثوقة وليست */
.calib{display:flex;gap:10px;align-items:flex-start;background:rgba(242,153,74,.07);
  border:1px solid rgba(242,153,74,.28);border-radius:3px;padding:12px 14px;margin-bottom:14px;
  font-size:11.5px;color:var(--text2);line-height:1.85;font-weight:300}
.calib svg{color:var(--warning);flex-shrink:0;margin-top:2px}
.calib b{color:var(--warning);font-weight:600}
.calib .lnk{background:none;border:none;color:var(--gold2);cursor:pointer;font-size:11.5px;
  text-decoration:underline;padding:0;font-family:inherit}

/* ═══════════ الخلفية المتحركة ═══════════
   طبقةٌ ثابتة خلف كل شيء، تظهر في البوابة وفي صدر الرئيسية فقط.
   الحجاب فوقها شرطُ قراءةٍ لا زينة: النص الفاتح على فيديو متحرك يفقد
   تباينه كلما مرّ خطٌّ لامع تحته. */
/* z-index سالب: تقع خلف كل محتوى الصفحة وفوق خلفية الجسم، بلا حاجة
   إلى فرض طبقةٍ على بقية العناصر — وفرضُها كان يكسر تثبيت البوابة. */
#backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  opacity:0;transition:opacity .9s ease}
#backdrop.on{opacity:1}
#backdrop video{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  min-width:100%;min-height:100%;width:auto;height:auto;object-fit:cover;
  filter:saturate(.9) brightness(.95)}
.bd-scrim{position:absolute;inset:0;
  background:
    radial-gradient(115% 85% at 50% 12%, rgba(4,5,13,.10), rgba(4,5,13,.62) 72%),
    linear-gradient(180deg, rgba(7,9,21,.28), rgba(4,5,13,.80))}

/* البوابة تصير شفافة فوق الفيديو بدل خلفيتها المرسومة */
#gate.over-backdrop{background:transparent;background-image:none}
/* البوابة شفافة الآن، وكان لونُها المعتم هو ما يحجب الشريط العلوي.
   نُخفيه صراحةً ما دامت البوابة مفتوحة — ولا وظيفة له قبل الدخول. */
body.gated nav.topnav{display:none}
/* بطاقة البوابة تكتسب لوحًا خفيفًا لتفصل نصّها عن حركة الفيديو */
#gate.over-backdrop .gate-card{background:rgba(7,9,21,.55);backdrop-filter:blur(9px);
  border:1px solid var(--line);border-radius:5px;padding:30px 26px}
/* وصدر الرئيسية كذلك: الفيديو يحلّ محلّ التدرّج المرسوم */
.risk-hero.over-backdrop{background:linear-gradient(140deg,rgba(216,190,134,.05),rgba(4,5,13,.45) 60%);
  border-color:var(--line2);backdrop-filter:blur(2px)}

/* من أطفأ الحركة لا يُعرض له فيديو متحرك أصلًا — الملصق الساكن يكفي */
@media (prefers-reduced-motion:reduce){
  #backdrop video{display:none}
  #backdrop{background:var(--bg2)}
}

/* شريط أعلى صفحة المستند: العودة وتحليل مستند آخر */
.doc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:6px}

/* قائمة الدفعة في شاشة الرفع */
.batchlist{border:1px solid var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bl-head{font-size:10px;letter-spacing:.08em;color:var(--gold);font-weight:600;
  padding:10px 12px;background:var(--goldFaint);border-bottom:1px solid var(--line)}
.bl-row{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:11.5px;
  border-bottom:1px solid var(--line);background:var(--card)}
.bl-row:last-of-type{border-bottom:none}
.bl-n{width:18px;height:18px;border-radius:2px;background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--text3);flex-shrink:0}
.bl-name{flex:1;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-len{font-size:9.5px;color:var(--text3);font-variant-numeric:tabular-nums;flex-shrink:0}
.bl-x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;
  padding:0 4px;line-height:1;flex-shrink:0}
.bl-x:hover{color:var(--danger)}
.bl-clear{width:100%;background:none;border:none;border-top:1px solid var(--line);
  color:var(--text3);cursor:pointer;font-size:10.5px;padding:9px;font-family:inherit}
.bl-clear:hover{color:var(--danger)}

/* سطر تلميح تحت عنوان القسم في شاشة الرفع */
.hintline{font-size:10px;color:var(--text3);margin-bottom:10px;line-height:1.7}
/* منطقة الإفلات الأساسية تتميّز عن المرجع */
.drop.hot{border-color:rgba(216,190,134,.42)}
.drop.hot:hover,.drop.hot.drag{border-color:var(--gold)}
/* إشعار الانطلاق التلقائي — ومعه مخرجٌ لمن أراد إضافة ملفات أخرى */
.auto-note{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:8px;padding:9px 12px;border:1px solid rgba(216,190,134,.3);
  background:var(--goldFaint);border-radius:2px;font-size:11px;color:var(--gold2)}
.auto-note .auto-stop{background:none;border:1px solid var(--line2);color:var(--text2);
  border-radius:2px;padding:4px 11px;font-size:10.5px;cursor:pointer;font-family:inherit}
.auto-note .auto-stop:hover{border-color:var(--gold);color:var(--gold2)}
</style>
</head>

<!-- الخلفية المتحركة: عنصر واحد يخدم البوابة والصدر معًا، فلا يُفكّ الفيديو
     مرتين ولا يُضمَّن مرتين. يُنقل موضعه بالـCSS لا بإعادة الإنشاء.
     muted + playsinline شرطا التشغيل التلقائي في المتصفحات كلها.
     aria-hidden لأنه زينةٌ محضة لا يحمل معنى لقارئ الشاشة. -->
<div id="backdrop" aria-hidden="true">
  <video id="backdropVid" autoplay loop muted playsinline preload="auto"
         poster="">
    <!-- VP9 أولًا: أصغر حجمًا ويدعمه كروم وفَيَرفُكس وإدج وسفاري ١٤٫١+.
         وH.264 يليه لما هو أقدم — المتصفح يختار أولَ ما يفهمه. -->
    <source src="" type="video/webm">
    <source src="" type="video/mp4">
  </video>
  <div class="bd-scrim"></div>
</div>

      'صاحب الترخيص','المرخص له','المستأجر','المؤجر','الشركة','الموظف','البائع','المشتري'],

        /* جدول I-2: الصف احتمالية، والعمود أثرٌ بترتيب order.

          moderate: ['veryLow', 'low',     'moderate', 'moderate', 'high'    ],
          low:      ['veryLow', 'low',     'low',      'low',      'moderate'],
          veryLow:  ['veryLow', 'veryLow', 'veryLow',  'veryLow',  'low'     ]
        }
      },

      /* ═══ عتبات الجوهرية ═══
         سؤالٌ لا يجيبه أي معيار عالمي: متى يصير المبلغ جسيمًا؟ الجواب
         يختلف بحجم الجهة اختلافًا جذريًا — ٥٠٠ ألف ريال كارثةٌ لمنشأة
         صغيرة وبندٌ هامشي لبنكٍ كبير. وNIST نفسه يعرّف الأثر وصفًا
         («أثر جسيم أو كارثي») ويترك تحديدَه للجهة.
         القيم أدناه **نقطة بداية لا معيار**، اضبطها من «إعدادات المحرك».
         ونسب الأثر مُنزَّلة على مستويات NIST الخمسة لتقع في مداها. */
      materiality: {
        currency: 'ريال',
        calibrated: false,          // تصير true متى ضبطتها الجهة
        bands: [
          { upTo: 1000,      impact: 0.02, label: 'منخفض جدًا' },
          { upTo: 50000,     impact: 0.12, label: 'منخفض'      },
          { upTo: 500000,    impact: 0.50, label: 'متوسط'      },
          { upTo: 5000000,   impact: 0.88, label: 'مرتفع'      },
          { upTo: null,      impact: 0.98, label: 'مرتفع جدًا' }
        ]
      },

      probability: { overdue:0.95, d7:0.75, d30:0.55, d90:0.35, far:0.20, none:0.50 },
      decay:       { overdue:1.60, d7:1.45, d14:1.30, d30:1.15, d90:1.00, far:0.85 },
      /* عتبتا NIST: «مرتفع» يبدأ من ٨٠ و«متوسط» من ٢١ */
      thresholds:  { critical:80, medium:21 },
      aggregate:   { maxWeight:0.6, rmsWeight:0.4 },
      coverageThreshold: 0.45,
      gapProbability: { missingClause:0.60, vague:0.55, uncovered:0.60, noDeadline:0.50 },
      gapImpact:      { vague:0.55, uncovered:0.75 }
    },

    /* الجهات والجهد المقترحان لكل نوع فجوة */
    remediation: {
      'موعد متجاوز':     { owner:'إدارة العقود',      effort:'عاجل — أيام' },
      'التزام بلا موعد': { owner:'الإدارة القانونية', effort:'متوسط — أسبوع' },
      'صياغة فضفاضة':    { owner:'الإدارة القانونية', effort:'منخفض — أيام' },
      'بند مفقود':       { owner:'الإدارة القانونية', effort:'متوسط — أسبوعان' },
      'متطلب غير مغطى':  { owner:'إدارة الالتزام',    effort:'متوسط — أسبوعان' }
    }
  };

  var KEY = 'nadheer:config:v3';

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* دمج عميق: أي مفتاح غائب من إعدادات المستخدم يعود لقيمته الافتراضية،
     فترقية النسخة لا تكسر إعدادات محفوظة قديمة. */
  function merge(base, over) {
    if (over === null || over === undefined) return clone(base);
    if (Array.isArray(base)) return Array.isArray(over) ? clone(over) : clone(base);
    if (typeof base !== 'object') return typeof over === typeof base ? over : base;
    var out = {}, k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = merge(base[k], over[k]);
    return out;
  }

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return clone(DEFAULTS);
      return merge(DEFAULTS, JSON.parse(raw));
    } catch (e) { return clone(DEFAULTS); }
  }
  function save(cfg) {
    cfg.version = VERSION;
    try { window.localStorage.setItem(KEY, JSON.stringify(cfg)); return true; }
    catch (e) { return false; }
  }
  function reset() {
    try { window.localStorage.removeItem(KEY); } catch (e) {}
    return clone(DEFAULTS);
  }

  /* مقارنة إعدادين لإنتاج سطور «ما تغيّر» في سجل التتبع */
  function diff(a, b, prefix) {
    prefix = prefix || '';
    var out = [], k;
    for (k in b) {
      if (!Object.prototype.hasOwnProperty.call(b, k)) continue;
      var pa = a ? a[k] : undefined, pb = b[k], p = prefix ? prefix + '.' + k : k;
      if (pb && typeof pb === 'object' && !Array.isArray(pb)) out = out.concat(diff(pa || {}, pb, p));
      else {
        var sa = JSON.stringify(pa), sb = JSON.stringify(pb);
        if (sa !== sb) out.push({ path: p, from: sa, to: sb });
      }
    }
    return out;
  }

  return { DEFAULTS: DEFAULTS, VERSION: VERSION, load: load, save: save, reset: reset,
           merge: merge, clone: clone, diff: diff };
});

<script>/* نذير — محرك التحليل الحتمي (بلا إنترنت، بلا نموذج لغوي)

   لا يوجد أي استدعاء شبكة في هذا الملف. */
(function (root, factory) {
  var cfg = (typeof module === 'object' && module.exports) ? require('./config.js') : root.NadheerConfig;

})(typeof self !== 'undefined' ? self : this, function (NC) {
  'use strict';

  var DAY = 86400000;

  /* ═══════════ ١. التطبيع ═══════════ */

  var AR_DIGITS = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',

     الخريطة هي ما يسمح لنا بإبراز الاقتباس في المستند الأصلي بدقة. */
  function normMap(text) {

    for (i = 0; i < text.length; i++) {

      if ('إأآٱا'.indexOf(c) > -1) c = 'ا';
      else if ('ىي'.indexOf(c) > -1) c = 'ي';
      else if (c === 'ة') c = 'ه';
      else if (c === 'ؤ') c = 'و';
      else if (c === 'ئ') c = 'ي';
      else c = c.toLowerCase();
      if (/[\s ]/.test(c)) {
        if (norm === '' || norm.charAt(norm.length - 1) === ' ') continue;
        c = ' ';
      }
      norm += c; map.push(i);
    }

  }

  function normStr(t) { return normMap(t || '').norm.trim(); }

  /* يطبّع كل عناصر قائمة كلمات مرة واحدة عند التحميل، حتى لا يختلف
     تطبيع القوائم عن تطبيع النص. */
  function normList(arr) {
    var out = [], i, v;
    for (i = 0; i < arr.length; i++) { v = normStr(arr[i]); if (v) out.push(v); }
    return out;

    for (var i = 0; i < terms.length; i++) if (normText.indexOf(terms[i]) > -1) return terms[i];

  }

  /* ═══════════ ٢. التقويم ═══════════ */

  /* التقويم الهجري المدني (الخوارزمية الجدولية). يفارق تقويم أم القرى
     بيوم واحد أحيانًا — لذلك كل تاريخ هجري يُعلَّم approx = true. */
  function hijriToJDN(y, m, d) {
    return Math.floor((11 * y + 3) / 30) + 354 * y + 30 * m -
           Math.floor((m - 1) / 2) + d + 1948440 - 386;
  }

    var i = Math.floor(4000 * (l + 1) / 1461001);

  var GREG_MONTHS = normList([

    'سبتمبر','أكتوبر','اكتوبر','نوفمبر','ديسمبر']);
  var GREG_MONTH_NO = { 'يناير':1,'فبراير':2,'مارس':3,'ابريل':4,'مايو':5,'يونيو':6,

    'كانون الثاني':1,'شباط':2,'اذار':3,'نيسان':4,'ايار':5,'حزيران':6,
    'تموز':7,'اب':8,'ايلول':9,'تشرين الاول':10,'تشرين الثاني':11,'كانون الاول':12 };
  var HIJRI_MONTH_NO = { 'محرم':1,'صفر':2,'ربيع الاول':3,'ربيع الاخر':4,'ربيع الثاني':4,
    'جمادي الاولي':5,'جمادي الاخره':6,'جمادي الثانيه':6,'رجب':7,'شعبان':8,
    'رمضان':9,'شوال':10,'ذو القعده':11,'ذي القعده':11,'ذو الحجه':12,'ذي الحجه':12 };

  /* ═══════════ ٣. استخراج التواريخ ═══════════ */

  /* ملاحظة: لا تضع 'هـ' هنا — التطويل يُحذف في التطبيع فتصير 'ه' المجردة
     وتطابق أي نص عربي تقريبًا. لاحقة الهجري تُفحص بعد نهاية التاريخ مباشرة. */
  var HIJRI_HINT = normList(['هجري','هجرية','للهجرة','أم القرى','تقويم أم القرى']);

    var out = [], m, re;

    re = /(\d{4})\s*[-\/\.]\s*(\d{1,2})\s*[-\/\.]\s*(\d{1,2})/g;
    while ((m = re.exec(norm))) out.push(mk(m.index, m[0], +m[1], +m[2], +m[3]));

    // DD-MM-YYYY / DD/MM/YYYY  (الترتيب السائد في المستندات العربية)
    re = /(\d{1,2})\s*[-\/\.]\s*(\d{1,2})\s*[-\/\.]\s*(\d{4})/g;

        out.push(mk(m.index, m[0], +m[2], mo, +m[1], isH));

  /* ═══════════ ٤. استخراج المدد ═══════════ */

  var NUM_WORDS = {};
  (function () {
    var raw = { 'واحد':1,'واحدة':1,'يوم واحد':1,'اثنان':2,'اثنين':2,'اثنتين':2,'يومين':2,'شهرين':2,'أسبوعين':2,'سنتين':2,

      // العشرات المركّبة شائعة في النصوص النظامية: «خلال أربع وعشرين ساعة»
      'أحد عشر':11,'إحدى عشرة':11,'اثني عشر':12,'اثنا عشر':12,'اثنتي عشرة':12,'اثنتا عشرة':12,
      'ثلاثة عشر':13,'أربعة عشر':14,'ستة عشر':16,'سبعة عشر':17,'ثمانية عشر':18,'تسعة عشر':19,

    Object.keys(raw).forEach(function (k) { NUM_WORDS[normStr(k)] = raw[k]; });

  var UNITS = [
    { terms: normList(['ساعة','ساعه','ساعات','ساعةً']), days: 1 / 24 },
    { terms: normList(['يوم','يوماً','يوما','أيام','ايام','يومًا']), days: 1 },
    { terms: normList(['أسبوع','اسبوع','أسابيع','اسابيع','أسبوعاً','اسبوعا']), days: 7 },
    { terms: normList(['شهر','شهراً','شهرا','أشهر','اشهر','شهور']), days: 30 },
    { terms: normList(['سنة','سنوات','عام','أعوام','اعوام','سنوياً','سنويا']), days: 365 }
  ];

  /* يبحث عن «خلال ٣٠ يومًا» و«خلال ثلاثين (30) يوماً» ونحوهما. */
  function findDurations(norm) {
    var out = [];
    UNITS.forEach(function (u) {
      u.terms.forEach(function (term) {
        var re = new RegExp('(^|[^\\u0621-\\u064A])' + term + '($|[^\\u0621-\\u064A])', 'g'), m;
        while ((m = re.exec(norm))) {
          var at = m.index + m[1].length;
          var before = norm.slice(Math.max(0, at - 40), at);
          var n = null, numLen = 0, numGap = 0;
          var dm = before.match(/(\d{1,4})(\s*\)?\s*)$/);          // رقم مباشر أو داخل قوسين
          if (dm) { n = +dm[1]; numLen = dm[1].length; numGap = dm[2].length; }
          if (n === null) {
            var keys = Object.keys(NUM_WORDS).sort(function (a, b) { return b.length - a.length; });
            for (var i = 0; i < keys.length; i++) {
              var tailWin = before.slice(-keys[i].length - 12);
              var kAt = tailWin.indexOf(keys[i]);
              if (kAt > -1) {
                n = NUM_WORDS[keys[i]]; numLen = keys[i].length;
                numGap = tailWin.length - kAt - keys[i].length;
                break;
              }
            }
          }

          // نطاق دقيق يبدأ من الرقم وينتهي بالوحدة — يسمح باستبدال «٥ أيام»
          // بـ«٢٤ ساعة» داخل جملة المستخدم نفسها بدل إعادة صياغتها.
          var numStart = at;
          if (numLen) numStart = at - numGap - numLen;
          // «ثلاثين (30) يوماً»: نبدأ من اللفظ لا من الرقم بين قوسين،
          // حتى لا يخرج نطاقٌ يقطع القوس فيفسد الاستبدال.
          var pre = norm.slice(Math.max(0, numStart - 26), numStart);
          var wm = pre.match(/([\u0621-\u064A]+(?: [\u0621-\u064A]+)?)(\s*\()$/);
          if (wm) {
            // الالتقاط جشع فيبتلع الكلمة السابقة («خلال ثلاثين»)، فنجرّب
            // العبارة كاملة ثم آخر كلمة فيها.
            var cand = [wm[1], wm[1].split(' ').pop()];
            for (var ci = 0; ci < cand.length; ci++) {
              if (NUM_WORDS[cand[ci]] !== undefined) {
                numStart = numStart - wm[2].length - cand[ci].length;
                break;
              }
            }
          }
          out.push({ at: at, days: n * u.days, s: Math.max(0, numStart), e: at + term.length,

        }
      });
    });
    out.sort(function (a, b) { return a.at - b.at || b.days - a.days; });
    var dedup = [];
    out.forEach(function (d) {
      var prev = dedup[dedup.length - 1];
      if (prev && Math.abs(d.at - prev.at) <= 6) return;   // نفس العبارة بصيغة وحدة أخرى
      dedup.push(d);
    });
    return dedup;
  }

  /* ═══════════ ٥. تقطيع الجُمل ═══════════ */

  /* النقطة تُنهي جملة فقط إن تلاها فراغ أو نهاية النص.
     بدون هذا الشرط تنقطع «غرامة 1.5%» عند «1.» و«ر.س» عند «ر.»،
     فيضيع باقي البند ويخرج اقتباس مشوَّه. */
  function isBreak(norm, i) {
    var c = norm[i];
    if ('؟!؛'.indexOf(c) > -1) return true;
    if (c !== '.') return false;
    var nxt = norm[i + 1];
    return nxt === undefined || nxt === ' ';
  }
  /* عنوان المادة يبدأ بندًا جديدًا وإن لم تنتهِ الفقرة قبله بنقطة —
     والوثائق النظامية لا تُنهي عناوينها بنقطة أصلًا. بلا هذا الفاصل
     تلتحم المواد ببعضها وبترويسة الوثيقة في جملة واحدة عملاقة، فيقصّها
     حدُّ الطول عند رقمٍ أعمى في منتصف عبارة — رأينا «بما فيها» تُقطع
     نصفين فاختفت مادة النطاق كلها عن الكشف. */
  var ART_HEAD = /الماد[هة]\s*(?:\(\s*[^\)]{1,14}\s*\)|[^\s:،\.]{2,14}\s*:)/g;

  function articleBreaks(norm) {
