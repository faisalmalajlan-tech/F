<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; connect-src blob: data: https:; worker-src blob:">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D8BE86' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 1.8 22.2 12 12 22.2 1.8 12Z' stroke-width='1.15' opacity='.55'/%3E%3Cpath d='M6.9 16.4a5.15 5.15 0 0 1 10.2 0' stroke-width='1.15' opacity='.45'/%3E%3Cpath d='M8.85 16.4a3.2 3.2 0 0 1 6.3 0' stroke-width='1.3' opacity='.8'/%3E%3Ccircle cx='12' cy='16.5' r='1.45' fill='%23D8BE86' stroke='none'/%3E%3C/svg%3E">
<title>نذير — ذكاء الامتثال الاستباقي</title>
<style>/*__CSS__*/</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-left">
    <button class="burger" id="burgerBtn" type="button" aria-label="فتح التنقل"></button>
    <div class="avatar" id="avatarLetter">ن</div>
    <div class="userinfo"><span class="un" id="userName">—</span><span class="ur" id="userRole">—</span></div>
  </div>
  <div style="display:flex;align-items:center">
    <!-- الشارة تتبدّل: بلا مزامنة تقول «بلا إنترنت» وهو صحيح، ومع
         المزامنة تقول «مشترك» — وإبقاؤها على الأولى ادّعاء كاذب. -->
    <span class="offline" id="offlinePill" title="لا يوجد أي اتصال بالشبكة في هذا التطبيق"><i></i>يعمل بلا إنترنت</span>
    <span class="syncpill" id="syncPill" style="display:none"><i></i></span>
    <button class="nav-brand" id="brandHome" type="button">
      <div><div class="nm">نذير</div><div class="sub">ذكاء الامتثال الاستباقي</div></div>
      <div class="brandmark" id="brandLogo"></div>
    </button>
  </div>
</nav>

<main class="page" id="pageContent"></main>

<div class="navoverlay" id="navOverlay">
  <div class="scrim" id="navScrim"></div>
  <nav class="navpanel" id="navPanel" aria-label="التنقّل"></nav>
</div>

<div id="proc">
  <div class="proc-wrap">
    <div class="proc-orb" id="procLogo"></div>
    <h2 style="font-size:20px;font-weight:200;margin-bottom:8px">نذير يقرأ مستندك</h2>
    <p style="color:var(--text3);font-size:11.5px;margin-bottom:8px;line-height:1.9;font-weight:300">
      التحليل يجري داخل جهازك. كل رقم تراه محسوب من نصّك، لا مقدَّر.</p>
    <div class="proc-steps" id="procSteps"></div>
  </div>
</div>

<div id="viewer">
  <div class="scrim" id="viewScrim"></div>
  <div class="viewpanel">
    <div class="vh"><div class="t" id="viewTitle">المستند الأصلي</div>
      <button id="viewClose" type="button" aria-label="إغلاق">✕</button></div>
    <div class="viewbody" id="viewBody"></div>
  </div>
</div>

<div id="gate"></div>

<!-- الخلفية المتحركة: عنصر واحد يخدم البوابة والصدر معًا، فلا يُفكّ الفيديو
     مرتين ولا يُضمَّن مرتين. يُنقل موضعه بالـCSS لا بإعادة الإنشاء.
     muted + playsinline شرطا التشغيل التلقائي في المتصفحات كلها.
     aria-hidden لأنه زينةٌ محضة لا يحمل معنى لقارئ الشاشة. -->
<div id="backdrop" aria-hidden="true">
  <video id="backdropVid" autoplay loop muted playsinline preload="auto"
         poster="__BACKDROP_POSTER__">
    <!-- VP9 أولًا: أصغر حجمًا ويدعمه كروم وفَيَرفُكس وإدج وسفاري ١٤٫١+.
         وH.264 يليه لما هو أقدم — المتصفح يختار أولَ ما يفهمه. -->
    <source src="__BACKDROP_WEBM__" type="video/webm">
    <source src="__BACKDROP__" type="video/mp4">
  </video>
  <div class="bd-scrim"></div>
</div>

<script>/*__PDFJS__*/</script>
<script>
/* عامل pdf.js مضمَّن كـ Blob — لا يوجد أي طلب شبكة */
(function () {
  try {
    var b64 = '/*__WORKER_B64__*/';
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/javascript' }));
    if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = url;
  } catch (e) { /* قراءة PDF ستتعطل، وبقية التطبيق يعمل */ }
})();
</script>

<script>/*__APP__*/</script>
</body>
</html>
