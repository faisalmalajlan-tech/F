(function () {
  try {
    var b64 = '/*__WORKER_B64__*/';
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);

    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/javascript' }));
    if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = url;
  } catch (e) { /* قراءة PDF ستتعطل، وبقية التطبيق يعمل */ }
})();
</script>
